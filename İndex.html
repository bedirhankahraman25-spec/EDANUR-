<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#12000d">

<title>AURA</title>

<style>

/* =========================
   TEMEL
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;

    color: #ffd1e8;

    background:
        radial-gradient(
            circle at 50% 30%,
            #5b1746 0%,
            #2b0823 28%,
            #12000f 62%,
            #040003 100%
        );

    position: relative;
}


/* =========================
   ARKA PLAN IŞIKLARI
========================= */

body::before {

    content: "";

    position: fixed;

    width: 280px;
    height: 280px;

    top: 5%;
    left: -100px;

    border-radius: 50%;

    background:
        rgba(255,80,170,0.15);

    filter: blur(70px);

    pointer-events: none;
}

body::after {

    content: "";

    position: fixed;

    width: 300px;
    height: 300px;

    right: -100px;
    bottom: 10%;

    border-radius: 50%;

    background:
        rgba(180,80,255,0.13);

    filter: blur(80px);

    pointer-events: none;
}


/* =========================
   YILDIZLAR
========================= */

.stars {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.star {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #ffd9ee;

    box-shadow:
        0 0 6px #ff69b4,
        0 0 12px #ff69b4;

    animation:
        twinkle 2s infinite ease-in-out;
}

.star:nth-child(1) {
    top: 12%;
    left: 12%;
}

.star:nth-child(2) {
    top: 20%;
    left: 82%;
    animation-delay: .5s;
}

.star:nth-child(3) {
    top: 35%;
    left: 7%;
    animation-delay: 1s;
}

.star:nth-child(4) {
    top: 44%;
    left: 91%;
    animation-delay: 1.4s;
}

.star:nth-child(5) {
    top: 8%;
    left: 55%;
    animation-delay: .8s;
}

.star:nth-child(6) {
    top: 52%;
    left: 18%;
    animation-delay: 1.7s;
}

.star:nth-child(7) {
    top: 30%;
    left: 72%;
    animation-delay: .3s;
}

.star:nth-child(8) {
    top: 63%;
    left: 88%;
    animation-delay: 1.1s;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}


/* =========================
   ÜST BAR
========================= */

.top-bar {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(15,0,12,0.82);

    border-bottom:
        1px solid
        rgba(255,105,180,0.35);

    backdrop-filter:
        blur(12px);

    position: relative;

    z-index: 5;
}

.logo {

    font-family:
        Georgia,
        serif;

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 4px;

    color: #ffd6eb;

    text-shadow:
        0 0 8px #ff69b4,
        0 0 20px #ff1493;
}

.status {

    font-size: 10px;

    letter-spacing: 2px;

    color: #ffafd2;
}

.status::before {

    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #ff69b4;

    box-shadow:
        0 0 7px #ff1493,
        0 0 14px #ff1493;
}


/* =========================
   ANA ALAN
========================= */

.main {

    height:
        calc(100vh - 60px);

    height:
        calc(100dvh - 60px);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    min-height:
        0;

    position:
        relative;

    z-index:
        2;
}


/* =========================
   KALP ALANI
========================= */

.heart-area {

    width:
        230px;

    height:
        205px;

    margin-top:
        5px;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-shrink:
        0;
}


/* =========================
   HALKALAR
========================= */

.heart-ring {

    position:
        absolute;

    border-radius:
        50%;

    border:
        1px solid
        rgba(255,140,200,0.38);

    box-shadow:
        0 0 8px
        rgba(255,80,170,0.15);
}

.ring1 {

    width:
        135px;

    height:
        135px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:
        rotate1 9s linear infinite;
}

.ring2 {

    width:
        170px;

    height:
        170px;

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate2 13s linear infinite;
}

.ring3 {

    width:
        205px;

    height:
        205px;

    border-left-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate1 17s linear infinite;
}


/* =========================
   KALP
========================= */

.heart {

    width:
        88px;

    height:
        88px;

    position:
        relative;

    transform:
        rotate(-45deg);

    background:
        linear-gradient(
            135deg,
            #ff9ed0,
            #ff3f9e 45%,
            #e60073
        );

    border-radius:
        9px;

    box-shadow:

        0 0 10px
        #ff69b4,

        0 0 25px
        rgba(255,20,147,0.8),

        0 0 50px
        rgba(255,20,147,0.45);

    animation:
        heartbeat 1.9s
        infinite
        ease-in-out;

    z-index:
        5;
}

.heart::before,
.heart::after {

    content:
        "";

    position:
        absolute;

    width:
        88px;

    height:
        88px;

    border-radius:
        50%;

    background:
        linear-gradient(
            135deg,
            #ff9ed0,
            #ff3f9e 45%,
            #e60073
        );
}

.heart::before {

    top:
        -44px;

    left:
        0;
}

.heart::after {

    top:
        0;

    left:
        44px;
}


/* =========================
   KALP YAZISI
========================= */

.heart-text {

    position:
        absolute;

    z-index:
        20;

    width:
        125px;

    left:
        -18px;

    top:
        36px;

    transform:
        rotate(45deg);

    text-align:
        center;

    color:
        #fff7fb;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        10px;

    font-weight:
        bold;

    letter-spacing:
        1px;

    line-height:
        1.25;

    white-space:
        nowrap;

    text-shadow:

        0 0 4px
        #ffffff,

        0 0 9px
        #ffb6d9,

        0 0 15px
        #ff69b4;

    pointer-events:
        none;
}


/* =========================
   KALP ANİMASYON
========================= */

@keyframes heartbeat {

    0%,
    100% {

        transform:
            rotate(-45deg)
            scale(1);
    }

    50% {

        transform:
            rotate(-45deg)
            scale(1.07);
    }
}

@keyframes rotate1 {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform:
            rotate(360deg);
    }

    to {
        transform:
            rotate(0deg);
    }
}


/* =========================
   SOHBET
========================= */

#chat {

    width:
        min(92%, 600px);

    flex:
        1;

    min-height:
        0;

    overflow-y:
        auto;

    padding:
        5px 5px 10px;

    scrollbar-width:
        thin;

    scrollbar-color:
        #c93479
        transparent;
}

.message {

    max-width:
        85%;

    padding:
        10px 13px;

    margin-bottom:
        10px;

    border-radius:
        14px;

    line-height:
        1.4;

    white-space:
        pre-wrap;

    font-size:
        14px;

    backdrop-filter:
        blur(8px);
}

.aura {

    background:
        rgba(70,5,45,0.72);

    margin-right:
        auto;

    border:
        1px solid
        rgba(255,105,180,0.28);

    color:
        #ffd9ea;
}

.user {

    background:
        linear-gradient(
            135deg,
            rgba(170,35,105,0.82),
            rgba(110,20,80,0.82)
        );

    margin-left:
        auto;

    color:
        white;

    border:
        1px solid
        rgba(255,150,210,0.3);
}


/* =========================
   ALT PANEL
========================= */

#bottom {

    width:
        100%;

    min-height:
        65px;

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        10px;

    background:
        rgba(15,0,12,0.94);

    border-top:
        1px solid
        rgba(255,105,180,0.35);

    backdrop-filter:
        blur(12px);

    z-index:
        10;
}

#input {

    flex:
        1;

    min-width:
        0;

    height:
        45px;

    padding:
        12px 14px;

    border-radius:
        13px;

    border:
        1px solid
        rgba(255,105,180,0.45);

    outline:
        none;

    background:
        rgba(45,2,30,0.9);

    color:
        #ffd5e8;

    font-size:
        14px;

    box-shadow:
        inset 0 0 12px
        rgba(255,20,147,0.08);
}

#input::placeholder {

    color:
        #a96787;
}

button {

    height:
        45px;

    border:
        1px solid
        #ff69b4;

    border-radius:
        13px;

    padding:
        0 15px;

    background:
        linear-gradient(
            135deg,
            #8e175d,
            #bd2879
        );

    color:
        #fff0f7;

    font-size:
        14px;

    cursor:
        pointer;

    box-shadow:
        0 0 12px
        rgba(255,20,147,0.25);
}

button:active {

    transform:
        scale(0.94);
}


/* =========================
   MOBİL
========================= */

@media (max-width: 500px) {

    .heart-area {

        transform:
            scale(0.86);

        margin-top:
            -2px;

        margin-bottom:
            -17px;
    }

    .logo {

        font-size:
            18px;
    }

    button {

        padding:
            0 11px;
    }

    .message {

        font-size:
            13px;
    }
}

</style>

</head>


<body>


<!-- YILDIZLAR -->

<div class="stars">

    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

</div>


<!-- ÜST BAR -->

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>


<!-- ANA -->

<div class="main">


    <!-- KALP -->

    <div class="heart-area">

        <div class="heart-ring ring1"></div>

        <div class="heart-ring ring2"></div>

        <div class="heart-ring ring3"></div>


        <div class="heart">

            <div class="heart-text">
                I LOVE YOU 300
            </div>

        </div>

    </div>


    <!-- SOHBET -->

    <div id="chat"></div>


    <!-- ALT PANEL -->

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey söyle..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>


</div>


<script>


/* =========================
   ELEMENTLER
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");


/* =========================
   MESAJ
========================= */

function addMessage(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   DEMO GÖNDER
========================= */

function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {

        return;
    }

    addMessage(
        text,
        "user"
    );

    input.value = "";

}


/* =========================
   BUTON
========================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================
   İLK MESAJ
========================= */

addMessage(
    "Merhaba. Ben AURA. Seni dinliyorum.",
    "aura"
);


</script>


</body>

</html>
