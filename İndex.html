<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#12000d">

<title>AURA</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;

    color: #ff69b4;

    background:
        radial-gradient(
            circle at center,
            #3b0927 0%,
            #17000f 45%,
            #050005 100%
        );
}


/* =========================
   ÜST BAR
========================= */

.top-bar {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(15,0,10,0.9);

    border-bottom:
        1px solid
        rgba(255,80,170,0.45);
}

.logo {

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 4px;

    color: #ff69b4;

    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;
}

.status {

    font-size: 11px;

    letter-spacing: 2px;

    color: #ff9dcc;
}

.status::before {

    content: "";

    display: inline-block;

    width: 7px;

    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #ff69b4;

    box-shadow:
        0 0 8px #ff1493,
        0 0 15px #ff1493;
}


/* =========================
   ANA ALAN
========================= */

.main {

    height:
        calc(100vh - 60px);

    height:
        calc(100dvh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    min-height: 0;
}


/* =========================
   KALP ALANI
========================= */

.heart-area {

    width: 250px;

    height: 250px;

    margin-top: 15px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;
}


/* =========================
   IŞIK HALKALARI
========================= */

.heart-ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,105,180,0.7);
}

.ring1 {

    width: 170px;

    height: 170px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {

    width: 215px;

    height: 215px;

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {

    width: 250px;

    height: 250px;

    border-left-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate1 14s linear infinite;
}


/* =========================
   KALP
========================= */

.heart {

    position: relative;

    width: 125px;

    height: 125px;

    transform:
        rotate(-45deg);

    background:
        #ff1493;

    box-shadow:

        0 0 15px #ff1493,

        0 0 35px #ff1493,

        0 0 70px
        rgba(255,20,147,0.8);

    animation:
        heartbeat 1.8s
        infinite
        ease-in-out;

    z-index: 5;
}

.heart::before,
.heart::after {

    content: "";

    position: absolute;

    width: 125px;

    height: 125px;

    border-radius: 50%;

    background:
        #ff1493;
}

.heart::before {

    top: -62px;

    left: 0;
}

.heart::after {

    top: 0;

    left: 62px;
}


/* =========================
   KALP YAZISI
========================= */

.heart-text {

    position: absolute;

    z-index: 10;

    color: white;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;

    white-space: nowrap;

    transform:
        rotate(45deg);

    text-shadow:

        0 0 5px white,

        0 0 10px white;

    pointer-events: none;
}


/* =========================
   ANİMASYONLAR
========================= */

@keyframes heartbeat {

    0%,
    100% {

        transform:
            rotate(-45deg)
            scale(1);
    }

    50% {

        transform:
            rotate(-45deg)
            scale(1.08);
    }
}

@keyframes rotate1 {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform:
            rotate(360deg);
    }

    to {
        transform:
            rotate(0deg);
    }
}


/* =========================
   DURUM
========================= */

.aura-status {

    margin-top:
        -5px;

    margin-bottom:
        8px;

    font-size:
        10px;

    letter-spacing:
        3px;

    color:
        #ff9dcc;
}


/* =========================
   SOHBET
========================= */

#chat {

    width:
        min(92%, 600px);

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;
}

.message {

    max-width:
        85%;

    padding:
        10px 13px;

    margin-bottom:
        10px;

    border-radius:
        12px;

    line-height:
        1.4;

    white-space:
        pre-wrap;

    font-size:
        14px;
}

.aura {

    background:
        rgba(70,0,40,0.8);

    margin-right:
        auto;

    border:
        1px solid
        rgba(255,105,180,0.3);
}

.user {

    background:
        rgba(150,20,90,0.8);

    margin-left:
        auto;

    color:
        white;
}


/* =========================
   ALT PANEL
========================= */

#bottom {

    width:
        100%;

    min-height:
        65px;

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        10px;

    background:
        rgba(15,0,10,0.97);

    border-top:
        1px solid
        rgba(255,105,180,0.4);
}

#input {

    flex:
        1;

    min-width:
        0;

    height:
        45px;

    padding:
        12px;

    border-radius:
        9px;

    border:
        1px solid
        rgba(255,105,180,0.5);

    outline:
        none;

    background:
        rgba(45,0,25,0.95);

    color:
        #ff9dcc;

    font-size:
        14px;
}

#input::placeholder {

    color:
        #a95d83;
}

button {

    height:
        45px;

    border:
        1px solid
        #ff69b4;

    border-radius:
        9px;

    padding:
        0 14px;

    background:
        rgba(100,0,55,0.9);

    color:
        #ff9dcc;

    font-size:
        14px;

    cursor:
        pointer;
}

button:active {

    transform:
        scale(0.94);
}

@media (max-width: 500px) {

    .heart-area {

        transform:
            scale(0.82);

        margin-top:
            -5px;

        margin-bottom:
            -20px;
    }

    .logo {

        font-size:
            18px;
    }

    button {

        padding:
            0 11px;
    }
}

</style>

</head>


<body>


<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>


<div class="main">


    <div class="heart-area">

        <div class="heart-ring ring1"></div>

        <div class="heart-ring ring2"></div>

        <div class="heart-ring ring3"></div>


        <div class="heart">

            <div class="heart-text">
                I LOVE YOU 300
            </div>

        </div>

    </div>


    <div class="aura-status">
        LOVE SYSTEM READY
    </div>


    <div id="chat"></div>


    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey söyle..."
            autocomplete="off"
        >

        <button id="sendButton">
            Gönder
        </button>

    </div>


</div>


<script>

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");


function addMessage(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    addMessage(
        text,
        "user"
    );

    input.value = "";

    setTimeout(
        function() {

            addMessage(
                "Merhaba. Ben AURA. Seni dinliyorum.",
                "aura"
            );

        },
        400
    );
}


sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


addMessage(
    "Merhaba. Ben AURA.\n\nLove system hazır.",
    "aura"
);

</script>


</body>

</html>
