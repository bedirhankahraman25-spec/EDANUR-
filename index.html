<script>

/* =====================================================
   AURA — TEMEL DEĞİŞKENLER
===================================================== */

const chat =
    document.getElementById(
        "chat"
    );

const input =
    document.getElementById(
        "input"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const statusElement =
    document.getElementById(
        "status"
    );


/* =====================================================
   HAFIZA
===================================================== */

const MEMORY_KEY =
    "EDANUR_AURA_MEMORY_V2";

const CHAT_KEY =
    "EDANUR_AURA_CHAT_V2";


function defaultMemory() {

    return {

        facts: [],

        preferences: [],

        notes: []

    };

}


function loadMemory() {

    try {

        const data =
            localStorage.getItem(
                MEMORY_KEY
            );

        if (!data) {

            return defaultMemory();

        }

        const parsed =
            JSON.parse(
                data
            );

        return {

            facts:
                Array.isArray(
                    parsed.facts
                )
                    ? parsed.facts
                    : [],

            preferences:
                Array.isArray(
                    parsed.preferences
                )
                    ? parsed.preferences
                    : [],

            notes:
                Array.isArray(
                    parsed.notes
                )
                    ? parsed.notes
                    : []

        };

    }

    catch(error) {

        console.error(
            "Hafıza okunamadı:",
            error
        );

        return defaultMemory();

    }

}


let memory =
    loadMemory();


function saveMemory() {

    try {

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(
                memory
            )
        );

    }

    catch(error) {

        console.error(
            "Hafıza kaydedilemedi:",
            error
        );

    }

}


/* =====================================================
   SOHBET GEÇMİŞİ
===================================================== */

function loadChat() {

    try {

        const data =
            localStorage.getItem(
                CHAT_KEY
            );

        if (!data) {

            return [];

        }

        const parsed =
            JSON.parse(
                data
            );

        return Array.isArray(
            parsed
        )
            ? parsed
            : [];

    }

    catch(error) {

        return [];

    }

}


let conversation =
    loadChat();


function saveChat() {

    try {

        conversation =
            conversation.slice(
                -20

        localStorage.setItem(
            CHAT_KEY,
            JSON.stringify(

            )
        );

    catch(error) {

        console.error(

            error
        );

}

function addMessage(

) {

    const message =

/* =====================================================
   HAFIZA METNİ
===================================================== */

function memoryText() {

    let result = "";

    if (
        memory.facts.length
    ) {

        result +=
            "Bilgiler:\n";

        memory.facts.forEach(
            function(item) {

                result +=
                    "- " +
                    item +
                    "\n";

            }
        );

    }


    if (
        memory.preferences.length
    ) {

        result +=
            "\nTercihler:\n";

        memory.preferences.forEach(
            function(item) {

                result +=
                    "- " +
                    item +
                    "\n";

            }
        );

    }


    if (
        memory.notes.length
    ) {

        result +=
            "\nNotlar:\n";

        memory.notes.forEach(
            function(item) {

                result +=
                    "- " +
                    item +
                    "\n";

            }
        );

    }


    return result ||
        "Kayıtlı bilgi yok.";

}


/* =====================================================
   BASİT HAFIZA KOMUTLARI
===================================================== */

function handleMemory(
    text
) {

    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    const notePrefixes = [

        "not al",

        "not kaydet",

        "bunu not al",

        "bunu kaydet"

    ];


    for (
        const prefix
        of notePrefixes
    ) {

        if (
            lower.startsWith(
                prefix
            )
        ) {

            const value =
                text
                    .substring(
                        prefix.length
                    )
                    .replace(
                        /^[:\s]+/,
                        ""
                    )
                    .trim();


            if (!value) {

                return {
                    handled: true,
                    response:
                        "Ne kaydetmemi istediğini söyle."
                };

            }


            memory.notes.push(
                value
            );

            saveMemory();


            return {
                handled: true,
                response:
                    "Tamam, bunu hafızama kaydettim."
            };

        }

    }


    const rememberPrefixes = [

        "bunu hatırla",

        "bunu hafızana al",

        "bunu hafızanda tut",

        "bunu unutma"

    ];


    for (
        const prefix
        of rememberPrefixes
    ) {

        if (
            lower.startsWith(
                prefix
            )
        ) {

            const value =
                text
                    .substring(
                        prefix.length
                    )
                    .replace(
                        /^[:\s]+/,
                        ""
                    )
                    .trim();


            if (!value) {

                return {
                    handled: true,
                    response:
                        "Hatırlamamı istediğin bilgiyi söyle."
                };

            }


            memory.facts.push(
                value
            );

            saveMemory();


            return {
                handled: true,
                response:
                    "Tamam, bunu hatırlayacağım."
            };

        }

    }


    if (

        lower ===
        "hafızamda ne var"

        ||

        lower ===
        "hafizamda ne var"

        ||

        lower ===
        "neyi hatırlıyorsun"

        ||

        lower ===
        "neyi hatirliyorsun"

    ) {

        return {

            handled: true,

            response:
                memoryText()

        };

    }


    if (

        lower ===
        "hafızanı temizle"

        ||

        lower ===
        "hafizani temizle"

    ) {

        memory =
            defaultMemory();

        saveMemory();


        return {

            handled: true,

            response:
                "Tamam, hafızayı temizledim."

        };

    }


    return {

        handled: false

    };

    }

async function askAI(
    userText
) {

    if (
        typeof puter ===
        "undefined"
    ) {

        throw new Error(
            "Puter yüklenmedi."
        );

    }


    const messages = [

        {

            role:
                "system",

            content:
                buildSystemPrompt()

        },

        ...conversation.slice(
            -10
        ),

        {

            role:
                "user",

            content:
                userText

        }

    ];


    const response =
        await puter.ai.chat(
            messages,
            {

                model:
                    "gpt-5.3-chat",

                tools: [

                    {
                        type:
                            "web_search"
                    }

                ]

            }
        );


    let answer = "";


    if (
        response &&
        response.message &&
        typeof response.message.content ===
        "string"
    ) {

        answer =
            response.message.content;

    }

    else if (
        response &&
        typeof response.text ===
        "string"
    ) {

        answer =
            response.text;

    }

    else if (
        typeof response ===
        "string"
    ) {

        answer =
            response;

    }

    else {

        answer =
            String(response);

    }


    answer =
        answer.trim();


    if (!answer) {

        throw new Error(
            "AI boş cevap verdi."
        );

    }


    return answer;

}

                text;


            sendMessage(
                true
            );

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );


            listening =
                false;

            micButton.textContent =
                "🎤";

            statusElement.textContent =
                "ONLINE";

        };


    recognition.onend =
        function() {

            listening =
                false;

            micButton.textContent =
                "🎤";

            statusElement.textContent =
                "ONLINE";

        };

}


setupRecognition();


/* =====================================================
   MİKROFON BUTONU
===================================================== */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            addMessage(
                "Bu tarayıcı sesli konuşmayı desteklemiyor.",
                "aura"
            );

            return;

        }


        if (listening) {

            try {

                recognition.stop();

            }

            catch(error) {

                console.error(
                    error
                );

            }

            return;

        }


        try {

            recognition.start();

        }

        catch(error) {

            console.error(
                "Mikrofon başlatılamadı:",
                error
            );

        }

    }
);


/* =====================================================
   AURA İLK AÇILIŞ
===================================================== */

if (
    conversation.length ===
    0
) {

    addMessage(
        "Merhaba. Ben AURA. Hazırım.",
        "aura"
    );

}


statusElement.textContent =
    "ONLINE";


input.focus();


/* =====================================================
   GENEL HATA YAKALAMA
===================================================== */

window.addEventListener(
    "error",
    function(event) {

        console.error(
            "AURA GLOBAL ERROR:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event) {

        console.error(
            "AURA PROMISE ERROR:",
            event.reason
        );

    }
);

</script>

</body>

</html>
