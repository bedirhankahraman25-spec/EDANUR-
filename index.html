<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#08030c">
<title>AURA • EDANUR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 35%,
            rgba(255,75,180,.18),
            transparent 32%),
        radial-gradient(circle at 20% 80%,
            rgba(150,50,255,.14),
            transparent 35%),
        linear-gradient(
            145deg,
            #030105,
            #100615 45%,
            #050208
        );
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

#topBar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:58px;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:rgba(5,2,9,.72);
    border-bottom:1px solid rgba(255,105,205,.13);
    backdrop-filter:blur(16px);
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.crown{
    color:#ff8bdc;
    font-size:17px;
    text-shadow:
        0 0 8px #ff35b8,
        0 0 20px #ff35b8;
}

.brandText{
    font-family:Georgia,serif;
    font-size:20px;
    letter-spacing:4px;
    color:#fff;
    text-shadow:
        0 0 8px #ff4bc4,
        0 0 22px #d400ff;
}

.online{
    display:flex;
    align-items:center;
    gap:6px;
    color:#ffb9e9;
    font-size:8px;
    letter-spacing:2px;
}

.onlineDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff4fc7;
    box-shadow:
        0 0 8px #ff4fc7,
        0 0 16px #ff4fc7;
}
  <style>
#main{
    position:absolute;
    top:58px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
}

#heartArea{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:
        transform .45s ease,
        filter .35s ease;
}

#app.chat-open #heartArea{
    transform:translateY(-23%);
}

.heart{
    position:relative;
    width:205px;
    height:185px;
    cursor:pointer;
    user-select:none;
    filter:
        drop-shadow(0 0 12px rgba(255,45,180,.9))
        drop-shadow(0 0 42px rgba(200,30,255,.45));
    animation:
        heartFloat 3.2s ease-in-out infinite;
}

.heart:before,
.heart:after{
    content:"";
    position:absolute;
    top:0;
    width:105px;
    height:165px;
    border-radius:
        100px 100px 0 0;
    background:
        linear-gradient(
            145deg,
            #ffb4e8,
            #ff38b8 38%,
            #b000ff 78%,
            #5d0b82
        );
}

.heart:before{
    left:50px;
    transform:
        rotate(-45deg);
    transform-origin:
        0 100%;
}

.heart:after{
    right:50px;
    transform:
        rotate(45deg);
    transform-origin:
        100% 100%;
}

.heartGlow{
    position:absolute;
    inset:20px;
    z-index:3;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 0%,
            rgba(255,130,220,.45) 8%,
            rgba(255,30,170,.18) 35%,
            transparent 70%
        );
    filter:blur(7px);
    animation:
        glowPulse 2.4s ease-in-out infinite;
    pointer-events:none;
}

.heartText{
    position:absolute;
    z-index:8;
    left:50%;
    top:54%;
    transform:translate(-50%,-50%);
    width:150px;
    text-align:center;
    font-family:Georgia,serif;
    font-size:18px;
    line-height:1.15;
    letter-spacing:2px;
    color:#fff;
    text-shadow:
        0 0 5px #fff,
        0 0 14px #ff57c9,
        0 0 28px #ff22b4;
    pointer-events:none;
}

.orbit{
    position:absolute;
    inset:-18px;
    border:1px solid rgba(255,115,216,.38);
    border-radius:50%;
    transform:rotate(-12deg) scaleY(.46);
    animation:
        orbitSpin 9s linear infinite;
    pointer-events:none;
}

.orbit2{
    inset:-30px;
    border-color:rgba(187,75,255,.22);
    transform:
        rotate(48deg) scaleY(.42);
    animation:
        orbitSpinReverse 13s linear infinite;
}

@keyframes heartFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }
    50%{
        transform:translateY(-7px) scale(1.025);
    }
}

@keyframes glowPulse{
    0%,100%{opacity:.55;transform:scale(.92)}
    50%{opacity:1;transform:scale(1.08)}
}

@keyframes orbitSpin{
    from{transform:rotate(-12deg) scaleY(.46)}
    to{transform:rotate(348deg) scaleY(.46)}
}

@keyframes orbitSpinReverse{
    from{transform:rotate(48deg) scaleY(.42)}
    to{transform:rotate(-312deg) scaleY(.42)}
}
  <style>
#quickTools{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    gap:8px;
}

.quickButton{
    min-width:48px;
    height:38px;
    padding:0 12px;
    border-radius:14px;
    color:#ffb7e9;
    background:
        rgba(255,70,190,.07);
    border:
        1px solid
        rgba(255,100,210,.18);
    box-shadow:
        inset 0 0 12px
        rgba(255,40,190,.03);
    font-size:10px;
}

.quickButton:active{
    transform:scale(.94);
}

#fairyButton{
    font-size:17px;
    width:48px;
    padding:0;
}

#storyButton{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.chatPanel{
    position:absolute;
    left:8px;
    right:8px;
    bottom:8px;
    height:min(61%,590px);
    z-index:60;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-radius:22px;
    background:
        linear-gradient(
            180deg,
            rgba(24,7,27,.98),
            rgba(5,2,10,.99)
        );
    border:
        1px solid
        rgba(255,91,202,.18);
    box-shadow:
        0 0 50px rgba(0,0,0,.55),
        0 0 30px rgba(190,30,220,.08);
    backdrop-filter:blur(18px);
    transform:
        translateY(calc(100% + 30px));
    opacity:0;
    pointer-events:none;
    transition:
        transform .38s ease,
        opacity .25s ease;
}

#app.chat-open .chatPanel{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
}

.drag{
    width:42px;
    height:4px;
    margin:7px auto;
    border-radius:10px;
    background:rgba(255,180,230,.32);
    flex-shrink:0;
}

.chatHead{
    min-height:38px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:
        1px solid
        rgba(255,100,210,.08);
}

.chatTitle{
    color:#ff8bd9;
    font-size:10px;
    letter-spacing:2px;
}

.closeChat{
    width:29px;
    height:29px;
    border-radius:9px;
    color:#d7a6c8;
    background:rgba(255,255,255,.045);
}
  <style>
#chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px;
}

.message{
    display:flex;

}

.message.user{
    justify-content:flex-end;
}

.bubble{

    line-height:1.55;

    word-break:break-word;
}

.message.aura .bubble{

        rgba(190,35,160,.11);

        1px solid
        rgba(255,95,210,.12);
}

.message.user .bubble{

        rgba(111,31,155,.24);

        1px solid
        rgba(190,90,255,.2);
}

.label{
    display:block;

    font-size:8px;

    letter-spacing:1px;
}

.message.user .label{
    text-align:right;
    color:#c996ff;
}

#typing{
    display:none;
    padding:
        0 12px 6px;
    color:#9d728f;
    font-size:9px;
}

#typing.show{
    display:block;
}

.inputArea{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px;
    border-top:
        1px solid
        rgba(255,100,210,.08);
}

.inputWrap{
    position:relative;
    flex:1;
    min-width:0;
    height:44px;
}

#userInput{
    width:100%;
    height:100%;
    padding:
        0 43px 0 12px;
    border-radius:13px;
    border:
        1px solid
        rgba(255,100,210,.16);
    outline:none;
    background:
        rgba(255,255,255,.035);
    color:#fff;
    font-size:12px;
}

#userInput::placeholder{
    color:#8f687e;
}

#sendButton{
    position:absolute;
    right:4px;
    top:4px;
    width:36px;
    height:36px;
    border-radius:10px;
    background:
        linear-gradient(
            135deg,
            #ff55c5,
            #b53aff
        );
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.toolButton{
    width:43px;
    height:43px;
    flex:0 0 43px;
    border-radius:12px;
    color:#ff9cdf;
    background:
        rgba(255,75,195,.06);
    border:
        1px solid
        rgba(255,100,210,.16);
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(6px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
  <style>
.storyPanel{
    position:absolute;
    inset:0;
    z-index:100;
    display:none;
    flex-direction:column;
    padding:
        14px 12px 18px;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,70,190,.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #120512,
            #050208
        );
}

.storyPanel.open{
    display:flex;
}

.storyTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:12px;
}

.storyHeading{
    font-family:Georgia,serif;
    color:#fff;
    font-size:20px;
    letter-spacing:2px;
    text-shadow:
        0 0 12px #ff42bc;
}

.storySub{
    color:#9d718f;

}

.storyClose{
    width:34px;
    height:34px;
    border-radius:11px;
    color:#ff9bdc;
    background:
        rgba(255,255,255,.05);
    border:
        1px solid
        rgba(255,100,210,.14);
}

.storyList{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding-top:5px;
}

.storyCard{
    position:relative;
    margin-bottom:9px;
    padding:11px;
    border-radius:15px;
    background:
        linear-gradient(
            135deg,
            rgba(255,70,190,.08),
            rgba(135,45,220,.07)
        );
    border:
        1px solid
        rgba(255,100,210,.13);
}

.storyName{
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.storyMeta{
    color:#8f6d81;
    font-size:8px;
    margin-top:3px;
}

.storyControls{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:9px;
}

.storyPlay{
    width:34px;
    height:34px;
    border-radius:10px;
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #ff4fbd,
            #a939ff
        );
}

.storyProgress{
    flex:1;
    height:4px;
    appearance:none;
    border-radius:5px;

    outline:none;
}

.storyProgress::-webkit-slider-thumb{
    appearance:none;
    width:12px;
    height:12px;
    border-radius:50%;

}

.storyTime{
    width:67px;
    text-align:right;

    font-size:8px;
}
  <style>
.storyVolume{
    width:62px;
    appearance:none;

    background:#35142d;

.storyVolume::-webkit-slider-thumb{

    border-radius:50%;

}

.storyEmpty{
    padding:25px;

    color:#866477;
    font-size:10px;
}

.storyFooter{
    padding-top:10px;
    color:#704f62;
    font-size:8px;
    text-align:center;
}

.reglButton{
    position:absolute;
    right:14px;
    bottom:18px;
    z-index:25;
    width:40px;
    height:40px;
    border-radius:50%;
    color:#ffb7e5;
    background:
        rgba(255,70,180,.08);
    border:
        1px solid
        rgba(255,100,210,.18);
    box-shadow:
        0 0 16px
        rgba(255,60,190,.12);
}

.reglPanel{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:150;
    display:none;
    padding:16px;
    border-radius:18px;
    background:
        rgba(17,5,17,.98);
    border:
        1px solid
        rgba(255,100,210,.18);
    box-shadow:
        0 0 35px
        rgba(0,0,0,.55);
}

.reglPanel.open{
    display:block;
}

.reglTitle{
    color:#ff8bd9;
    font-family:Georgia,serif;
    font-size:16px;

}

.reglField{
    margin-bottom:10px;
}

.reglField label{
    display:block;

    margin-bottom:5px;
}

.reglField input{
    width:100%;
    height:38px;
    padding:0 10px;
    border-radius:10px;

        1px solid
        rgba(255,100,210,.15);
    background:rgba(255,255,255,.04);

}

.reglActions{
    display:flex;

}

.reglActions button{

.reglSave{

.reglClose{

  <style>

    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;

        rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
}

.securityModal.open{
    display:flex;
}

.securityBox{
    width:min(92%,370px);
    padding:18px;
    border-radius:18px;
    background:#100711;
    border:
        1px solid
        rgba(255,100,210,.18);
}

.securityBox h3{
    color:#ff8bd9;
    font-size:15px;
    margin-bottom:8px;
}

.securityBox p{
    color:#aa829b;

    line-height:1.5;
}

.securityActions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.securityActions button{
    flex:1;
    height:38px;
    border-radius:10px;
}

#securityCancel{
    color:#c6a6b8;
    background:rgba(255,255,255,.05);
}

#securityConfirm{
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #ff4fbd,
            #a83bff
        );
}

#toast{
    position:absolute;
    left:50%;
    bottom:17px;
    z-index:500;
    transform:
        translate(-50%,25px);
    opacity:0;
    pointer-events:none;
    padding:
        9px 13px;
    border-radius:10px;
    color:#fff;
    background:#160a16;
    border:
        1px solid
        rgba(255,100,210,.16);
    font-size:9px;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:
        translate(-50%,0);
}

.hiddenFile{
    display:none;
}

@media(max-height:650px){
    .heart{
        transform:scale(.82);
    }

    #app.chat-open #heartArea{
        transform:translateY(-28%);
    }

    .chatPanel{
        height:66%;
    }
}
</style>
</head>

<body>

<div id="app">

    <header id="topBar">

        <div class="brand">
            <span class="crown">♕</span>
            <span class="brandText">AURA</span>
        </div>

        <div class="online">
            <span class="onlineDot"></span>
            ONLINE
        </div>

    </header>

    <main id="main">

        <section id="heartArea">

            <div
                id="auraHeart"
                class="heart"
                aria-label="AURA'yı aç">

                <div class="orbit"></div>
                <div class="orbit orbit2"></div>
                <div class="heartGlow"></div>

                <div class="heartText">
                    I LOVE<br>
                    YOU 3000
                </div>

            </div>

        </section>

        <button
            id="reglButton"
            class="reglButton">
            🌸
        </button>

        <div id="quickTools">

            <button
                id="storyButton"
                class="quickButton">
                📖 Masallarım
            </button>

            <button
                id="fairyButton"
                class="quickButton"
                aria-label="Kalp">
                ♡
            </button>

        </div>

        <section
            id="chatPanel"
            class="chatPanel">

            <div
                id="chatDrag"
                class="drag">
            </div>

            <div class="chatHead">

                <span class="chatTitle">
                    AURA • EDANUR
                </span>

                <button
                    id="closeChat"
                    class="closeChat">
                    ×
                </button>

            </div>

            <div id="chat"></div>

            <div id="typing">
                AURA düşünüyor...
            </div>

            <div class="inputArea">

                <input
                    id="fileInput"
                    class="hiddenFile"
                    type="file">

                <button
                    id="fileButton"
                    class="toolButton">
                    +
                </button>

                <div class="inputWrap">

                    <input
                        id="userInput"
                        type="text"
                        autocomplete="off"
                        placeholder="AURA'ya bir şey söyle...">

                    <button
                        id="sendButton">
                        ➤
                    </button>

                </div>

            </div>

        </section>

        <section
            id="storyPanel"
            class="storyPanel">

            <div class="storyTop">

                <div>
                    <div class="storyHeading">
                        Masallarım
                    </div>

                    <div class="storySub">
                        Senin sesinden masallar
                    </div>
                </div>

                <button
                    id="closeStories"
                    class="storyClose">
                    ×
                </button>

            </div>

            <div
                id="storyList"
                class="storyList">
            </div>

            <div class="storyFooter">
                Dinlenen masallar cihazda saklanabilir.
            </div>

        </section>

        <section
            id="reglPanel"
            class="reglPanel">

            <div class="reglTitle">
                🌸 Regl Takibi
            </div>

            <div class="reglField">

                <label>
                    Son regl başlangıç tarihi
                </label>

                <input
                    id="periodDate"
                    type="date">

            </div>

            <div class="reglField">

                <label>
                    Döngü uzunluğu (gün)
                </label>

                <input
                    id="cycleLength"
                    type="number"
                    min="15"
                    max="60"
                    value="28">

            </div>

            <div
                id="periodResult">
            </div>

            <div class="reglActions">

                <button
                    id="savePeriod"
                    class="reglSave">
                    Kaydet
                </button>

                <button
                    id="closePeriod"
                    class="reglClose">
                    Kapat
                </button>

            </div>

        </section>

        <div
            id="securityModal"
            class="securityModal">

            <div class="securityBox">

                <h3>
                    Güvenlik Onayı
                </h3>

                <p id="securityText">
                    Bu işlem için onay gerekiyor.
                </p>

                <div class="securityActions">

                    <button id="securityCancel">
                        İptal
                    </button>

                    <button id="securityConfirm">
                        Onayla
                    </button>

                </div>

            </div>

        </div>

        <div id="toast"></div>

    </main>

</div>
<script src="https://js.puter.com/v2/"></script>

<script>
"use strict";

const VERSION="EDANUR-AURA-STORY-1.0";

const USER_NAME=
    (localStorage.getItem(
        "aura_user_name"
    ) || "Bedirhan Kahraman").trim();

const GIRLFRIEND_NAME=
    (localStorage.getItem(
        "aura_girlfriend_name"
    ) || "Edanur Kahraman").trim();

const STORAGE={
    memories:"ed_aura_memories_v1",
    history:"ed_aura_history_v1",
    tasks:"ed_aura_tasks_v1",
    voice:"ed_aura_voice_v1",
    period:"ed_aura_period_v1",
    storyProgress:"ed_aura_story_progress_v1",
    storyVolume:"ed_aura_story_volume_v1"
};

const AURA={

    try{

            : fallback;
    }catch{

    }
}

function saveJSON(key,value){

        );

function addMemory(

    value

    if(
        !String(key).trim() ||
        !String(value).trim()

    const existing=
        AURA.memories.find(
            item=>
                item.key.toLocaleLowerCase(
                    "tr-TR"
                )===
                String(key)
                    .toLocaleLowerCase(
                        "tr-TR"
                    )
        );

    if(existing){

        existing.value=
            String(value);

        existing.updated=
            Date.now();

    }else{

        AURA.memories.push({
            id:
                Date.now()+"_"+Math.random(),
            key:
                String(key),
            value:
                String(value),
            created:
                Date.now()
        });
    }

    saveJSON(
        STORAGE.memories,
        AURA.memories
    );
}

function formatTime(seconds){

    if(
        !Number.isFinite(seconds)
    ){
        return "00:00";
    }

    const mins=
        Math.floor(seconds/60);

    const secs=
        Math.floor(seconds%60);

    return String(mins).padStart(2,"0")
        +":"+
        String(secs).padStart(2,"0");
}

  async function getOfflineAudio(
    story
){

    const cacheName=
        "ed-aura-story-audio-v1";

    const cache=
        await caches.open(
            cacheName
        );

    const cached=
        await cache.match(
            story.file
        );

    if(cached){

        return await cached.blob();
    }

    if(!navigator.onLine){

        throw new Error(
            "Bu masal henüz cihazda önbelleğe alınmamış."
        );
    }

    const response=
        await fetch(
            story.file,
            {
                cache:"no-cache"
            }
        );

    if(!response.ok){

        throw new Error(
            "Ses dosyası bulunamadı."
        );
    }

    await cache.put(
        story.file,
        response.clone()
    );

    return await response.blob();
}

async function createAudio(
    story
){

    const blob=
        await getOfflineAudio(
            story
        );

    const url=
        URL.createObjectURL(
            blob
        );

    const audio=
        new Audio(url);

    audio.volume=
        Number.isFinite(savedVolume)
            ? savedVolume
            : .9;

    audio.preload=
        "auto";

    return {
        audio,
        url
    };
}

async function playStory(
    storyId
){

    const story=
        STORIES.find(
            item=>item.id===storyId
        );

    if(!story)return;

    if(
        AURA.activeAudio &&
        AURA.activeStory!==storyId
    ){

        AURA.activeAudio.pause();

        AURA.activeAudio.currentTime=0;

        if(
            AURA.activeAudio.__url
        ){
            URL.revokeObjectURL(
                AURA.activeAudio.__url
            );
        }
    }

    if(
        AURA.activeAudio &&
        AURA.activeStory===storyId
    ){

        if(
            AURA.activeAudio.paused
        ){
            await AURA.activeAudio.play();
        }else{
            AURA.activeAudio.pause();
        }

        return;
    }

    try{

        const result=
            await createAudio(
                story
            );

        const audio=
            result.audio;

        audio.__url=
            result.url;

        AURA.activeAudio=
            audio;

        AURA.activeStory=
            storyId;

        const saved=
            Number(
                storyProgress[storyId] || 0
            );

        audio.addEventListener(
            "loadedmetadata",
            ()=>{
                if(
                    saved>0 &&
                    saved<audio.duration
                ){
                    audio.currentTime=
                        saved;
                }

                updateStoryCard(
                    storyId,
                    audio
                );
            }
        );
      audio.addEventListener(
            "timeupdate",
            ()=>{
                if(
                    audio.duration>0
                ){

                    storyProgress[
                        storyId
                    ]=
                        audio.currentTime;

                    saveJSON(
                        STORAGE.storyProgress,
                        storyProgress
                    );

                    updateStoryCard(
                        storyId,
                        audio
                    );
                }
            }
        );

        audio.addEventListener(
            "play",
            ()=>{
                updateStoryButtons();
            }
        );

        audio.addEventListener(
            "pause",
            ()=>{
                updateStoryButtons();
            }
        );

        audio.addEventListener(
            "ended",
            ()=>{

                storyProgress[
                    storyId
                ]=0;

                saveJSON(
                    STORAGE.storyProgress,
                    storyProgress
                );

                audio.currentTime=0;

                updateStoryButtons();

                updateStoryCard(
                    storyId,
                    audio
                );
            }
        );

        await audio.play();

        updateStoryButtons();

    }catch(error){

        console.error(
            "MASAL HATASI:",
            error
        );

        toast(
            navigator.onLine
                ? "Masal dosyası bulunamadı."
                : "Bu masal henüz çevrimdışı kaydedilmemiş."
        );
    }
}

    const progress=

            (
                audio.currentTime/
                audio.duration

    }

    time.textContent=

            audio.currentTime
        );
}

async function cacheAllStories(){

    if(!navigator.onLine){
        return;
    }

    let success=0;

    for(
        const story of STORIES
    ){

        try{

            const cache=
                await caches.open(
                    "ed-aura-story-audio-v1"
                );

            const existing=
                await cache.match(
                    story.file
                );

            if(existing){
                success++;
                continue;
            }

            const response=
                await fetch(
                    story.file,
                    {
                        cache:"no-cache"
                    }
                );

            if(response.ok){

                await cache.put(
                    story.file,
                    response.clone()
                );

                success++;
            }

        }catch(error){

            console.warn(
                "Masal önbelleğe alınamadı:",
                story.file
            );
        }
    }

    if(success>0){

        toast(
            `${success} masal cihaz için hazırlandı.`
        );
    }
}
  function cleanSpeechText(text){

    return String(text)
        .replace(
            /https?:\/\/\S+/gi,
            " "
        )
        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )
        .replace(
            /[*_`#~\[\]{}<>|\\/+=@#$%^&;:"'“”‘’!?.,…-]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}

function speak(text){

    if(
        !AURA.voiceEnabled ||
        !("speechSynthesis" in window)
    ){
        return;
    }

    const clean=
        cleanSpeechText(text);

    if(!clean)return;

    speechSynthesis.cancel();

    const utterance=
        new SpeechSynthesisUtterance(
            clean
        );

    utterance.lang=
        "tr-TR";

    utterance.rate=
        .92;

    utterance.pitch=
        1;

    utterance.volume=
        1;

    utterance.onstart=
        ()=>{
            AURA.speaking=true;
        };

    utterance.onend=
        ()=>{
            AURA.speaking=false;
        };

    speechSynthesis.speak(
        utterance
    );
}

function setupRecognition(){

    const Recognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!Recognition){
        return;
    }

    AURA.recognition=
        new Recognition();

    AURA.recognition.lang=
        "tr-TR";

    AURA.recognition.continuous=
        false;

    AURA.recognition.interimResults=
        false;

    AURA.recognition.onstart=
        ()=>{
            AURA.listening=true;
            heart.style.transform=
                "scale(1.06)";
        };

    AURA.recognition.onresult=
        event=>{

            const text=
                event.results[0][0]
                    .transcript
                    .trim();

            if(text){

                input.value=
                    text;

                sendMessage(
                    true
                );
            }
        };

    AURA.recognition.onerror=
        ()=>{
            AURA.listening=false;
            heart.style.transform="";
            toast(
                "Mikrofon kullanılamadı."
            );
        };

    AURA.recognition.onend=
        ()=>{
            AURA.listening=false;
            heart.style.transform="";
        };
}

    if(!AURA.recognition){

function extractAIText(
    response
){

    if(!response){
        return "";
    }

    if(
        typeof response==="string"
    ){
        return response.trim();
    }

    if(
        typeof response?.message?.content===
            "string"
    ){
        return response.message
            .content
            .trim();
    }

    if(
        Array.isArray(
            response?.message?.content
        )
    ){

        return response.message
            .content
            .map(
                part=>
                    typeof part==="string"
                        ? part
                        : part?.text||""
            )
            .join("")
            .trim();
    }

    if(
        typeof response?.text==="string"
    ){
        return response.text.trim();
    }

    return "";
}

async function askAI(
    text
){

    if(
        typeof puter==="undefined" ||
        !puter.ai ||
        typeof puter.ai.chat!=="function"
    ){

        throw new Error(
            "Puter AI hazır değil."
        );
    }

    const messages=[
        {
            role:"system",
            content:
                buildSystemPrompt()
        },

        ...AURA.history
            .slice(-12)
            .flatMap(
                item=>[
                    {
                        role:"user",
                        content:item.user
                    },
                    {
                        role:"assistant",
                        content:item.aura
                    }
                ]
            ),

        {
            role:"user",
            content:text
        }
    ];

    const response=
        await puter.ai.chat(
            messages,
            {
                model:"gpt-5.6-luna",
                temperature:.3,
                max_tokens:1800
            }
        );

    const answer=
        extractAIText(
            response
        );

    if(!answer){
        throw new Error(
            "AURA boş cevap aldı."
        );
    }

    return answer;
}
  async function sendMessage(
    voiceInput=false
){

    const text=
        input.value.trim();

    if(
        !text ||
        AURA.processing
    ){
        return;
    }

    input.value="";

    toggleChat(true);

    addMessage(
        text,
        "user",
        false
    );

    AURA.processing=true;

    typing.classList.add(
        "show"
    );

    try{

        let answer="";

        const lower=
            text.toLocaleLowerCase(
                "tr-TR"
            );

        if(
            lower.includes(
                "saat kaç"
            )
        ){

            answer=
                "Şu an saat "+
                new Date()
                    .toLocaleTimeString(
                        "tr-TR",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    )+".";

        }else if(
            lower.includes(
                "sen kimsin"
            ) ||
            lower.includes(
                "adın ne"
            )
        ){

            answer=
                "Ben AURA. Edanur için hazırlanan kişisel yapay zeka asistanıyım.";

        }else{

            answer=
                await askAI(text);
        }

        recordHistory(
            text,
            answer
        );

        addMessage(
            answer,
            "aura",
            voiceInput ||
            AURA.voiceEnabled
        );

    }catch(error){

        console.error(
            "EDANUR AURA:",
            error
        );

        addMessage(
            "AURA bağlantısında bir sorun oluştu. Lütfen tekrar deneyin.",
            "aura",
            false
        );

    }finally{

        AURA.processing=false;

        typing.classList.remove(
            "show"
        );
    }
}

    .addEventListener(
        "click",
        ()=>{
            addMessage(
                "Edanur için AURA hazır. Masallarım bölümünden senin sesinden kaydedilmiş masalları dinleyebilirsin.",
                "aura",
                false
            );

            toggleChat(true);
        }
    );

document
    .getElementById("fileButton")
    .addEventListener(
        "click",
        ()=>{
            fileInput.click();
        }
    );

fileInput.addEventListener(
    "change",
    async ()=>{

        const file=
            fileInput.files?.[0];

        if(!file)return;

        try{

            const text=
                await file.text();

            toggleChat(true);

            addMessage(
                `${file.name} dosyası alındı.`,
                "aura",
                false
            );

            const answer=
                await askAI(
                    `Bu dosyayı Türkçe analiz et. Dosya adı: ${file.name}\n\n${text.slice(0,50000)}`
                );

            addMessage(
                answer,
                "aura",
                false
            );

        }catch{

            toast(
                "Dosya okunamadı."
            );

        }finally{

            fileInput.value="";
        }
    }
);
  const periodDate=
    document.getElementById(
        "periodDate"
    );

const cycleLength=
    document.getElementById(
        "cycleLength"
    );

const periodResult=
    document.getElementById(
        "periodResult"
    );

function calculatePeriod(){

    const date=
        periodDate.value;

    const cycle=
        Number(
            cycleLength.value
        );

    if(
        !date ||
        cycle<15 ||
        cycle>60
    ){
        periodResult.textContent="";
        return;
    }

    const start=
        new Date(
            date+"T00:00:00"
        );

    const next=
        new Date(start);

    next.setDate(
        next.getDate()+cycle
    );

    periodResult.textContent=
        "Tahmini sonraki başlangıç: "+
        next.toLocaleDateString(
            "tr-TR"
        );
}

document
    .getElementById(
        "reglButton"
    )
    .addEventListener(
        "click",
        ()=>{
            const saved=
                loadJSON(
                    STORAGE.period,
                    null
                );

            if(saved){

                periodDate.value=
                    saved.date||"";

                cycleLength.value=
                    saved.cycle||28;
            }

            calculatePeriod();

            document
                .getElementById(
                    "reglPanel"
                )
                .classList.add(
                    "open"
                );
        }
    );

document
    .getElementById(
        "closePeriod"
    )
    .addEventListener(
        "click",
        ()=>{
            document
                .getElementById(
                    "reglPanel"
                )
                .classList.remove(
                    "open"
                );
        }
    );

document
    .getElementById(
        "savePeriod"
    )
    .addEventListener(
        "click",
        ()=>{

            const data={
                date:
                    periodDate.value,
                cycle:
                    Number(
                        cycleLength.value
                    )
            };

            saveJSON(
                STORAGE.period,
                data
            );

            calculatePeriod();

            toast(
                "Regl bilgisi kaydedildi."
            );
        }
    );

cycleLength.addEventListener(
    "input",
    calculatePeriod
);

periodDate.addEventListener(
    "change",
    calculatePeriod
);

window.addEventListener(
    "online",
    ()=>{
        AURA.online=true;

        cacheAllStories();
    }
);

window.addEventListener(
    "offline",
    ()=>{
        AURA.online=false;

        toast(
            "Çevrimdışı mod aktif."
        );
    }
);

chatPanel.addEventListener(
    "touchstart",
    event=>{
        window.__dragY=
            event.touches[0].clientY;
    },
    {passive:true}
);

chatPanel.addEventListener(
    "touchend",
    event=>{

        if(
            window.__dragY===undefined
        ){
            return;
        }

        const diff=
            event.changedTouches[0]
                .clientY-
            window.__dragY;

        window.__dragY=
            undefined;

        if(diff>70){
            toggleChat(false);
        }
    },
    {passive:true}
);

window.addEventListener(
    "beforeunload",
    ()=>{
        saveJSON(
            STORAGE.memories,
            AURA.memories
        );

        saveJSON(
            STORAGE.history,
            AURA.history
        );
    }
);

function init(){

    renderStories();

    setupRecognition();

    if(
        !chat.children.length
    ){

        addMessage(
            "Selam Edanur. AURA hazır.",
            "aura",
            false
        );
    }

    if(navigator.onLine){

        setTimeout(
            cacheAllStories,
            1500
        );
    }
}

init();

window.AURA_EDANUR_API={

    version:VERSION,

    openChat:
        ()=>toggleChat(true),

    closeChat:
        ()=>toggleChat(false),

    openStories:
        openStories,

    closeStories:
        closeStories,

    playStory:
        playStory,

    cacheStories:
        cacheAllStories,

    getStories:
        ()=>[...STORIES],

    getMemories:
        ()=>[...AURA.memories]

};

</script>
