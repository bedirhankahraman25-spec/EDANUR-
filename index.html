<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<meta
    name="theme-color"
    content="#08030d"
>

<title>AURA • EDANUR</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,70,190,.16),
            transparent 32%
        ),
        radial-gradient(
            circle at 20% 85%,
            rgba(120,40,255,.13),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #020105,
            #100611 48%,
            #030107
        );
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================
   ÜST BAR
========================= */

.topbar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:52px;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0 15px;

    background:
        rgba(5,2,10,.78);

    border-bottom:
        1px solid
        rgba(255,100,210,.12);

    backdrop-filter:
        blur(14px);
}

.logo{

    display:flex;
    align-items:center;

    gap:8px;
}

.logoText{

    font-family:
        Georgia,
        serif;

    font-size:19px;

    letter-spacing:4px;

    color:#fff;

    text-shadow:
        0 0 8px #ff4bc4,
        0 0 20px #c91aff;
}

.online{

    display:flex;
    align-items:center;

    gap:6px;

    font-size:8px;

    letter-spacing:2px;

    color:#ffb6e6;
}

.onlineDot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff4fc7;

    box-shadow:
        0 0 8px #ff4fc7,
        0 0 16px #ff4fc7;
}

/* =========================
   ANA ALAN
========================= */

.main{

    position:absolute;

    top:52px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;
}

</style>
    <style>

/* =========================
   AURA KALP ALANI
========================= */

.coreArea{

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:
        calc(100% - 82px);

    display:flex;

    align-items:center;
    justify-content:center;

    transition:
        transform .4s ease,
        opacity .3s ease;

    z-index:5;

    pointer-events:none;
}

.heart{

    position:relative;

    width:185px;
    height:165px;

    pointer-events:auto;

    cursor:pointer;

    animation:
        heartFloat
        3.2s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,40,180,.85)
        )
        drop-shadow(
            0 0 35px
            rgba(180,30,255,.45)
        );
}

/*
Gerçek kalp şekli
*/

.heartShape{

    position:absolute;

    left:50%;
    top:50%;

    width:150px;
    height:150px;

    transform:
        translate(-50%,-42%)
        rotate(-45deg);

    border-radius:
        18px 0 18px 0;

    background:
        linear-gradient(
            145deg,
            #ffb8e9,
            #ff43bc 38%,
            #c02aff 72%,
            #68128e
        );

    box-shadow:
        inset
        8px 8px 18px
        rgba(255,255,255,.16),

        inset
        -10px -12px 25px
        rgba(50,0,70,.3),

        0 0 25px
        rgba(255,50,190,.45);
}

.heartShape::before,
.heartShape::after{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffb8e9,
            #ff43bc 38%,
            #c02aff 72%,
            #68128e
        );
}

.heartShape::before{

    top:-75px;
    left:0;
}

.heartShape::after{

    top:0;
    left:75px;
}

.heartText{

    position:absolute;

    z-index:8;

    left:50%;
    top:53%;

    transform:
        translate(-50%,-50%);

    width:130px;

    text-align:center;

    font-family:
        Georgia,
        serif;

    font-size:20px;

    font-weight:700;

    letter-spacing:3px;

    color:#fff;

    text-shadow:
        0 0 6px #fff,
        0 0 15px #ff58c9,
        0 0 28px #d819ff;

    pointer-events:none;
}

/* =========================
   HALKALAR
========================= */

.ring{

    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    border:
        1px solid
        rgba(255,100,210,.35);

    pointer-events:none;
}

.ringOne{

    width:205px;
    height:78px;

    transform:
        translate(-50%,-50%)
        rotate(-14deg);

    animation:
        ringOne
        8s
        linear
        infinite;
}

.ringTwo{

    width:235px;
    height:88px;

    transform:
        translate(-50%,-50%)
        rotate(42deg);

    border-color:
        rgba(177,76,255,.22);

    animation:
        ringTwo
        12s
        linear
        infinite;
}

@keyframes ringOne{

    from{
        transform:
            translate(-50%,-50%)
            rotate(-14deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(346deg);
    }
}

@keyframes ringTwo{

    from{
        transform:
            translate(-50%,-50%)
            rotate(42deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(-318deg);
    }
}

@keyframes heartFloat{

    0%,
    100%{
        transform:
            translateY(0)
            scale(1);
    }

    50%{
        transform:
            translateY(-7px)
            scale(1.025);
    }
}

    </style>
    <style>

/* =========================
   ALT ÖZELLİKLER
========================= */

.featureBar{

    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    height:62px;

    z-index:30;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    padding:7px;

    border-radius:19px;

    background:
        rgba(8,3,13,.9);

    border:
        1px solid
        rgba(255,100,210,.13);

    box-shadow:
        0 8px 35px
        rgba(0,0,0,.45);

    backdrop-filter:
        blur(16px);
}

.featureButton{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:5px;

    min-width:0;

    height:46px;

    border-radius:13px;

    color:#ffb7e9;

    background:
        rgba(255,70,190,.055);

    border:
        1px solid
        rgba(255,100,210,.12);

    font-size:9px;

    white-space:nowrap;

    transition:
        background .2s,
        transform .15s;
}

.featureButton:active{

    transform:
        scale(.94);

    background:
        rgba(255,70,190,.13);
}

.featureIcon{

    font-size:15px;

    line-height:1;
}

/* =========================
   SOHBET PANELİ
========================= */

.chatPanel{

    position:absolute;

    left:8px;
    right:8px;

    bottom:8px;

    height:
        min(62%,560px);

    z-index:50;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border-radius:22px;

    background:
        linear-gradient(
            180deg,
            rgba(22,6,25,.98),
            rgba(5,2,9,.99)
        );

    border:
        1px solid
        rgba(255,100,210,.17);

    box-shadow:
        0 12px 50px
        rgba(0,0,0,.65),

        0 0 35px
        rgba(190,30,220,.08);

    backdrop-filter:
        blur(20px);

    transform:
        translateY(
            calc(100% + 25px)
        );

    opacity:0;

    pointer-events:none;

    transition:
        transform .4s ease,
        opacity .25s ease;
}

.chatPanel.open{

    transform:
        translateY(0);

    opacity:1;

    pointer-events:auto;
}

.dragHandle{

    width:42px;
    height:4px;

    margin:
        7px auto;

    border-radius:10px;

    background:
        rgba(255,180,230,.3);

    flex-shrink:0;
}

.chatHeader{

    min-height:39px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 12px;

    border-bottom:
        1px solid
        rgba(255,100,210,.08);
}

.chatTitle{

    color:#ff91dc;

    font-size:9px;

    letter-spacing:2px;
}

.closeButton{

    width:30px;
    height:30px;

    border-radius:9px;

    color:#e0a5c9;

    background:
        rgba(255,255,255,.045);
}

             </style>
    <style>

#chatMessages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        10px;

    scroll-behavior:smooth;
}

.message{

    display:flex;

    width:100%;

    margin-bottom:9px;

    animation:
        messageIn
        .2s
        ease;
}

.message.user{

    justify-content:flex-end;
}

.message.aura{

    justify-content:flex-start;
}

.bubble{

    max-width:84%;

    padding:
        10px 12px;

    border-radius:14px;

    font-size:12px;

    line-height:1.5;

    white-space:pre-wrap;

    word-break:break-word;
}

.message.user
.bubble{

    background:
        linear-gradient(
            135deg,
            rgba(135,40,185,.34),
            rgba(85,30,125,.25)
        );

    border:
        1px solid
        rgba(190,100,255,.18);

    border-bottom-right-radius:5px;
}

.message.aura
.bubble{

    background:
        rgba(255,70,190,.075);

    border:
        1px solid
        rgba(255,100,210,.12);

    border-bottom-left-radius:5px;
}

.messageLabel{

    display:block;

    margin-bottom:4px;

    font-size:8px;

    font-weight:700;

    letter-spacing:1px;

    color:#ff8ed9;
}

.message.user
.messageLabel{

    text-align:right;

    color:#c998ff;
}

#typing{

    display:none;

    padding:
        0 12px 5px;

    color:#966c87;

    font-size:9px;
}

#typing.show{

    display:block;
}

.inputArea{

    display:flex;

    align-items:center;

    gap:7px;

    padding:8px;

    border-top:
        1px solid
        rgba(255,100,210,.08);
}

.inputWrap{

    position:relative;

    flex:1;

    min-width:0;

    height:44px;
}

#userInput{

    width:100%;
    height:100%;

    padding:
        0 43px 0 12px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,100,210,.16);

    outline:none;

    background:
        rgba(255,255,255,.035);

    color:#fff;

    font-size:12px;
}

#userInput::placeholder{

    color:#876578;
}

#sendButton{

    position:absolute;

    top:4px;
    right:4px;

    width:36px;
    height:36px;

    border-radius:10px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff52c3,
            #a63aff
        );

    font-size:15px;
}

.toolButton{

    width:43px;
    height:43px;

    flex:0 0 43px;

    border-radius:12px;

    color:#ff9dde;

    background:
        rgba(255,70,190,.06);

    border:
        1px solid
        rgba(255,100,210,.15);
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:
            translateY(6px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

    </style>
    <style>

/* =========================
   MASALLAR
========================= */

.fullPanel{

    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    flex-direction:column;

    padding:
        14px 12px;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,70,190,.15),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #120512,
            #050208
        );
}

.fullPanel.open{

    display:flex;
}

.panelTop{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding-bottom:13px;
}

.panelTitle{

    font-family:
        Georgia,
        serif;

    color:#fff;

    font-size:20px;

    letter-spacing:2px;

    text-shadow:
        0 0 12px
        #ff42bc;
}

.panelSub{

    margin-top:3px;

    color:#967084;

    font-size:9px;
}

.panelClose{

    width:34px;
    height:34px;

    border-radius:11px;

    color:#ff9bdc;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,100,210,.13);
}

.storyList{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding-top:5px;
}

.storyCard{

    padding:11px;

    margin-bottom:9px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            rgba(255,70,190,.075),
            rgba(135,45,220,.065)
        );

    border:
        1px solid
        rgba(255,100,210,.12);
}

.storyName{

    color:#fff;

    font-size:12px;

    font-weight:700;
}

.storyMeta{

    margin-top:3px;

    color:#8c6a80;

    font-size:8px;
}

.storyControls{

    display:flex;

    align-items:center;

    gap:7px;

    margin-top:9px;
}

.storyPlay{

    width:34px;
    height:34px;

    flex:0 0 34px;

    border-radius:10px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff50bd,
            #a43aff
        );
}

.storyProgress{

    flex:1;

    min-width:0;

    height:4px;

    appearance:none;

    border-radius:5px;

    background:#321429;
}

.storyProgress::-webkit-slider-thumb{

    appearance:none;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#ff65c8;

    box-shadow:
        0 0 8px
        #ff65c8;
}

.storyTime{

    width:50px;

    text-align:right;

    color:#a37b96;

    font-size:8px;
}

.storyVolume{

    width:55px;

    height:3px;

    appearance:none;

    border-radius:5px;

    background:#35142d;
}

.storyVolume::-webkit-slider-thumb{

    appearance:none;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#d958ff;
}

    </style>
    
<style>

/* =========================
   REGL + ÖZEL GÜNLER
========================= */

.simpleContent{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        8px 2px;
}

.infoBox{

    padding:14px;

    margin-bottom:9px;

    border-radius:15px;

    background:
        rgba(255,70,190,.055);

    border:
        1px solid
        rgba(255,100,210,.12);
}

.infoBoxTitle{

    color:#ff91dc;

    font-family:
        Georgia,
        serif;

    font-size:15px;

    margin-bottom:10px;
}

.field{

    margin-bottom:10px;
}

.field label{

    display:block;

    margin-bottom:5px;

    color:#a57a92;

    font-size:8px;
}

.field input{

    width:100%;

    height:39px;

    padding:
        0 10px;

    border-radius:10px;

    outline:none;

    color:#fff;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,100,210,.14);
}

.actionButton{

    width:100%;

    height:40px;

    border-radius:11px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff50bd,
            #a43aff
        );
}

.specialItem{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:12px;

    margin-bottom:8px;

    border-radius:13px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,100,210,.09);
}

.specialName{

    color:#fff;

    font-size:11px;
}

.specialDate{

    color:#9a7289;

    font-size:8px;
}

.emptyText{

    padding:30px 10px;

    text-align:center;

    color:#816075;

    font-size:10px;
}

/* =========================
   MOBİL
========================= */

@media(max-height:650px){

    .heart{

        transform:
            scale(.82);
    }

    .featureBar{

        height:58px;
    }

    .featureButton{

        height:42px;
    }

    .chatPanel{

        height:66%;
    }
}

@media(max-width:350px){

    .featureButton{

        font-size:8px;
    }

    .featureIcon{

        font-size:13px;
    }

    .heart{

        transform:
            scale(.9);
    }
}

</style>
</head>

<body>

<div id="app">

<header class="topbar">

    <div class="logo">
        <span>♡</span>
        <span class="logoText">AURA</span>
    </div>

    <div class="online">
        <span class="onlineDot"></span>
        ONLINE
    </div>

</header>

<main class="main">

<section class="coreArea">

    <div
        id="auraHeart"
        class="heart"
    >

        <div class="ring ringOne"></div>

        <div class="ring ringTwo"></div>

        <div class="heartShape"></div>

        <div class="heartText">
            AURA
        </div>

    </div>

</section>

<nav class="featureBar">

    <button
        id="periodButton"
        class="featureButton"
    >
        <span class="featureIcon">🌸</span>
        <span>Regl</span>
    </button>

    <button
        id="specialButton"
        class="featureButton"
    >
        <span class="featureIcon">♡</span>
        <span>Özel Günler</span>
    </button>

    <button
        id="storiesButton"
        class="featureButton"
    >
        <span class="featureIcon">📖</span>
        <span>Masallarım</span>
    </button>

</nav>
<section
    id="chatPanel"
    class="chatPanel"
>

    <div
        id="chatHandle"
        class="dragHandle"
    ></div>

    <div class="chatHeader">

        <span class="chatTitle">
            AURA • EDANUR
        </span>

        <button
            id="closeChat"
            class="closeButton"
        >
            ×
        </button>

    </div>

    <div
        id="chatMessages"
    ></div>

    <div
        id="typing"
    >
        AURA düşünüyor...
    </div>

    <div class="inputArea">

        <input
            id="fileInput"
            type="file"
            hidden
        >

        <button
            id="fileButton"
            class="toolButton"
        >
            +
        </button>

        <div class="inputWrap">

            <input
                id="userInput"
                type="text"
                autocomplete="off"
                placeholder="AURA'ya bir şey söyle..."
            >

            <button
                id="sendButton"
            >
                ➤
            </button>

        </div>

    </div>

</section>

<section
    id="storiesPanel"
    class="fullPanel"
>

    <div class="panelTop">

        <div>

            <div class="panelTitle">
                Masallarım
            </div>

            <div class="panelSub">
                Senin sesinden masallar
            </div>

        </div>

        <button
            id="closeStories"
            class="panelClose"
        >
            ×
        </button>

    </div>

    <div
        id="storyList"
        class="storyList"
    ></div>

</section>

<section
    id="periodPanel"
    class="fullPanel"
>

    <div class="panelTop">

        <div>

            <div class="panelTitle">
                Regl Takibi
            </div>

            <div class="panelSub">
                Kişisel takip alanı
            </div>

        </div>

        <button
            id="closePeriod"
            class="panelClose"
        >
            ×
        </button>

    </div>

    <div class="simpleContent">

        <div class="infoBox">

            <div class="infoBoxTitle">
                Döngü Bilgileri
            </div>

            <div class="field">

                <label>
                    Son başlangıç tarihi
                </label>

                <input
                    id="periodDate"
                    type="date"
                >

            </div>

            <div class="field">

                <label>
                    Döngü uzunluğu
                </label>

                <input
                    id="cycleLength"
                    type="number"
                    min="15"
                    max="60"
                    value="28"
                >

            </div>

            <button
                id="savePeriod"
                class="actionButton"
            >
                Kaydet
            </button>

            <div
                id="periodResult"
                style="
                    margin-top:10px;
                    color:#ff9ddd;
                    font-size:10px;
                "
            ></div>

        </div>

    </div>

</section>

<section
    id="specialPanel"
    class="fullPanel"
>

    <div class="panelTop">

        <div>

            <div class="panelTitle">
                Özel Günler
            </div>

            <div class="panelSub">
                Hatırlamak istediğin günler
            </div>

        </div>

        <button
            id="closeSpecial"
            class="panelClose"
        >
            ×
        </button>

    </div>

    <div class="simpleContent">

        <div class="infoBox">

            <div class="infoBoxTitle">
                Yeni Özel Gün
            </div>

            <div class="field">

                <label>
                    Günün adı
                </label>

                <input
                    id="specialName"
                    type="text"
                    placeholder="Örneğin tanışma yıldönümü"
                >

            </div>

            <div class="field">

                <label>

<script>

"use strict";

const STORAGE = {

    memories:
        "ed_aura_memories_v2",

    history:
        "ed_aura_history_v2",

    period:
        "ed_aura_period_v2",

    special:
        "ed_aura_special_v2",

    stories:
        "ed_aura_story_progress_v2",

    volume:
        "ed_aura_story_volume_v2"

};

const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur Kahraman";

let memories =
    loadJSON(
        STORAGE.memories,
        []
    );

let history =
    loadJSON(
        STORAGE.history,
        []
    );

let specialDays =
    loadJSON(
        STORAGE.special,
        []
    );

let storyProgress =
    loadJSON(
        STORAGE.stories,
        {}
    );

let activeAudio = null;
let activeStory = null;

const heart =
    document.getElementById(
        "auraHeart"
    );

const chatPanel =
    document.getElementById(
        "chatPanel"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const userInput =
    document.getElementById(
        "userInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const typing =
    document.getElementById(
        "typing"
    );

const storiesPanel =
    document.getElementById(
        "storiesPanel"
    );

const periodPanel =
    document.getElementById(
        "periodPanel"
    );

const specialPanel =
    document.getElementById(
        "specialPanel"
    );

function loadJSON(
    key,
    fallback
){

    try{

        const value =
            localStorage.getItem(
                key
            );

        return value
            ? JSON.parse(value)
            : fallback;

    }catch{

        return fallback;
    }
}

function saveJSON(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.error(error);
    }
}

function closeAllPanels(){

    chatPanel.classList.remove(
        "open"
    );

    storiesPanel.classList.remove(
        "open"
    );

    periodPanel.classList.remove(
        "open"
    );

    specialPanel.classList.remove(
        "open"
    );
}

function openChat(){

    closeAllPanels();

    chatPanel.classList.add(
        "open"
    );

    setTimeout(
        ()=>{
            userInput.focus();
            scrollChat();
        },
        250
    );
}

function closeChat(){

    chatPanel.classList.remove(
        "open"
    );
}

heart.addEventListener(
    "click",
    openChat
);

document
    .getElementById("closeChat")
    .addEventListener(
        "click",
        closeChat
    );

function scrollChat(){

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}

function addMessage(
    text,
    type
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message " +
        type;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    const label =
        document.createElement(
            "span"
        );

    label.className =
        "messageLabel";

    label.textContent =
        type === "user"
            ? "EDANUR"
            : "AURA";

    bubble.appendChild(
        label
    );

    bubble.appendChild(
        document.createTextNode(
            String(text)
        )
    );

    row.appendChild(
        bubble
    );

    chatMessages.appendChild(
        row
    );

    scrollChat();
}

function cleanSpeech(
    text
){

    return String(text)

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[*_`#~[\]{}<>|\\/+=@#$%^&;:"'“”‘’!?.,…-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    const clean =
        cleanSpeech(text);

    if(!clean){
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );

    utterance.lang =
        "tr-TR";

    utterance.rate =
        .92;

    utterance.pitch =
        1;

    speechSynthesis.speak(
        utterance
    );
}

</script>
<script>

const STORIES = Array.from(
    {length:20},
    (_,index)=>({

        id:
            "story_"+(index+1),

        title:
            "Masal "+(index+1),

        file:
            "masallar/masal"+
            (index+1)+
            ".mp3"

    })
);

function formatTime(
    seconds
){

    if(
        !Number.isFinite(seconds)
    ){
        return "00:00";
    }

    const min =
        Math.floor(
            seconds / 60
        );

    const sec =
        Math.floor(
            seconds % 60
        );

    return (
        String(min)
            .padStart(2,"0")
        +
        ":"
        +
        String(sec)
            .padStart(2,"0")
    );
}

function renderStories(){

    const list =
        document.getElementById(
            "storyList"
        );

    list.innerHTML = "";

    STORIES.forEach(
        story=>{

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "storyCard";

            card.innerHTML = `

                <div class="storyName">
                    ${story.title}
                </div>

                <div class="storyMeta">
                    Senin sesinden
                </div>

                <div class="storyControls">

                    <button
                        class="storyPlay"
                        data-story="${story.id}">
                        ▶
                    </button>

                    <input
                        class="storyProgress"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        data-progress="${story.id}"
                    >

                    <span
                        class="storyTime"
                        data-time="${story.id}">
                        00:00
                    </span>

                </div>
            `;

            list.appendChild(
                card
            );
        }
    );
}

async function getStoryAudio(
    story
){

    const cache =
        await caches.open(
            "ed-aura-stories-v2"
        );

    const cached =
        await cache.match(
            story.file
        );

    if(cached){

        const blob =
            await cached.blob();

        return {
            blob,
            cached:true
        };
    }

    if(
        !navigator.onLine
    ){

        throw new Error(
            "offline"
        );
    }

    const response =
        await fetch(
            story.file
        );

    if(
        !response.ok
    ){

        throw new Error(
            "missing"
        );
    }

    await cache.put(
        story.file,
        response.clone()
    );

    return {
        blob:
            await response.blob(),

        cached:false
    };
}

async function playStory(
    id
){

    const story =
        STORIES.find(
            item =>
                item.id === id
        );

    if(!story){
        return;
    }

    if(
        activeAudio &&
        activeStory === id
    ){

        if(
            activeAudio.paused
        ){

            await activeAudio.play();

        }else{

            activeAudio.pause();
        }

        updateStoryButtons();

        return;
    }

    if(activeAudio){

        activeAudio.pause();

        activeAudio = null;
    }

    try{

        const result =
            await getStoryAudio(
                story
            );

        const url =
            URL.createObjectURL(
                result.blob
            );

        const audio =
            new Audio(url);

        audio.volume =
            Number(
                localStorage.getItem(
                    STORAGE.volume
                ) || ".9"
            );

        activeAudio =
            audio;

        activeStory =
            id;

        const saved =
            Number(
                storyProgress[id] || 0
            );

        audio.addEventListener(
            "loadedmetadata",
            ()=>{

                if(
                    saved > 0 &&
                    saved < audio.duration
                ){

                    audio.currentTime =
                        saved;
                }

                updateStoryCard(
                    id,
                    audio
                );
            }
        );

        audio.addEventListener(
            "timeupdate",
            ()=>{

                storyProgress[id] =
                    audio.currentTime;

                saveJSON(
                    STORAGE.stories,
                    storyProgress
                );

                updateStoryCard(
                    id,
                    audio
                );
            }
        );

        audio.addEventListener(
            "play",
            updateStoryButtons
        );

        audio.addEventListener(
            "pause",
            updateStoryButtons
        );

        audio.addEventListener(
            "ended",
            ()=>{

                storyProgress[id] =
                    0;

                saveJSON(
                    STORAGE.stories,
                    storyProgress
                );

                updateStoryButtons();
            }
        );

        await audio.play();

        updateStoryButtons();

    }catch(error){

        console.error(
            error
        );

        alert(
            navigator.onLine
                ? "Masal dosyası bulunamadı."
                : "Bu masal henüz internetsiz dinleme için kaydedilmemiş."
        );
    }
}

function updateStoryButtons(){

    document
        .querySelectorAll(
            ".storyPlay"
        )
        .forEach(
            button=>{

                const active =
                    activeAudio &&
                    activeStory ===
                        button.dataset.story &&
                    !activeAudio.paused;

                button.textContent =
                    active
                        ? "Ⅱ"
                        : "▶";
            }
        );
}

function updateStoryCard(
    id,
    audio
){

    const slider =
        document.querySelector(
            `[data-progress="${id}"]`
        );

    const time =
        document.querySelector(
            `[data-time="${id}"]`
        );

    if(
        !slider ||
        !time
    ){
        return;
    }

    if(
        audio.duration > 0
    ){

        slider.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;
    }

    time.textContent =
        formatTime(
            audio.currentTime
        );
}

document
    .getElementById(
        "storiesButton"
    )
    .addEventListener(
        "click",
        ()=>{

            closeAllPanels();

            storiesPanel.classList.add(
                "open"
            );

            renderStories();
        }
    );

document
    .getElementById(
        "closeStories"
    )
    .addEventListener(
        "click",
        ()=>{
            storiesPanel.classList.remove(
                "open"
            );
        }
    );

document
    .getElementById(
        "storyList"
    )
    .addEventListener(
        "click",
        event=>{

            const button =
                event.target.closest(
                    ".storyPlay"
                );

            if(!button){
                return;
            }

            playStory(
                button.dataset.story
            );
        }
    );

document
    .getElementById(
        "storyList"
    )
    .addEventListener(
        "input",
        event=>{

            if(
                !event.target.classList.contains(
                    "storyProgress"
                )
            ){
                return;
            }

            if(
                !activeAudio ||
                activeStory !==
                    event.target.dataset.progress
            ){
                return;
            }

            if(
                activeAudio.duration > 0
            ){

                activeAudio.currentTime =
                    activeAudio.duration *
                    Number(
                        event.target.value
                    ) /
                    100;
            }
        }
    );

</script>
<script>

/* =========================
   REGL
========================= */

document
    .getElementById(
        "periodButton"
    )
    .addEventListener(
        "click",
        ()=>{

            closeAllPanels();

            periodPanel.classList.add(
                "open"
            );

            const saved =
                loadJSON(
                    STORAGE.period,
                    null
                );

            if(saved){

                document
                    .getElementById(
                        "periodDate"
                    )
                    .value =
                        saved.date || "";

                document
                    .getElementById(
                        "cycleLength"
                    )
                    .value =
                        saved.cycle || 28;

                calculatePeriod();
            }
        }
    );

document
    .getElementById(
        "closePeriod"
    )
    .addEventListener(
        "click",
        ()=>{
            periodPanel.classList.remove(
                "open"
            );
        }
    );

function calculatePeriod(){

    const date =
        document
            .getElementById(
                "periodDate"
            )
            .value;

    const cycle =
        Number(
            document
                .getElementById(
                    "cycleLength"
                )
                .value
        );

    const result =
        document
            .getElementById(
                "periodResult"
            );

    if(
        !date ||
        cycle < 15 ||
        cycle > 60
    ){

        result.textContent = "";

        return;
    }

    const start =
        new Date(
            date+"T00:00:00"
        );

    start.setDate(
        start.getDate()+cycle
    );

    result.textContent =
        "Tahmini sonraki başlangıç: "+
        start.toLocaleDateString(
            "tr-TR"
        );
}

document
    .getElementById(
        "savePeriod"
    )
    .addEventListener(
        "click",
        ()=>{

            const data = {

                date:
                    document
                        .getElementById(
                            "periodDate"
                        )
                        .value,

                cycle:
                    Number(
                        document
                            .getElementById(
                                "cycleLength"
                            )
                            .value
                    )
            };

            saveJSON(
                STORAGE.period,
                data
            );

            calculatePeriod();
        }
    );

/* =========================
   ÖZEL GÜNLER
========================= */

function renderSpecialDays(){

    const list =
        document.getElementById(
            "specialList"
        );

    list.innerHTML = "";

    if(
        specialDays.length === 0
    ){

        list.innerHTML = `
            <div class="emptyText">
                Henüz özel gün eklenmedi.
            </div>
        `;

        return;
    }

    specialDays.forEach(
        (item,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "specialItem";

            div.innerHTML = `

                <div>

                    <div class="specialName">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="specialDate">
                        ${escapeHTML(item.date)}
                    </div>

                </div>

                <button
                    data-delete="${index}"
                    class="panelClose">
                    ×
                </button>

            `;

            list.appendChild(
                div
            );
        }
    );
}

function escapeHTML(
    text
){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        );
}

document
    .getElementById(
        "specialButton"
    )
    .addEventListener(
        "click",
        ()=>{

            closeAllPanels();

            specialPanel.classList.add(
                "open"
            );

            renderSpecialDays();
        }
    );

document
    .getElementById(
        "closeSpecial"
    )
    .addEventListener(
        "click",
        ()=>{
            specialPanel.classList.remove(
                "open"
            );
        }
    );

document
    .getElementById(
        "saveSpecial"
    )
    .addEventListener(
        "click",
        ()=>{

            const name =
                document
                    .getElementById(
                        "specialName"
                    )
                    .value
                    .trim();

            const date =
                document
                    .getElementById(
                        "specialDate"
                    )
                    .value;

            if(
                !name ||
                !date
            ){

                alert(
                    "Özel gün adı ve tarihini gir."
                );

                return;
            }

            specialDays.push({

                name,
                date

            });

            saveJSON(
                STORAGE.special,
                specialDays
            );

            document
                .getElementById(
                    "specialName"
                )
                .value = "";

            document
                .getElementById(
                    "specialDate"
                )
                .value = "";

            renderSpecialDays();
        }
    );

document
    .getElementById(
        "specialList"
    )
    .addEventListener(
        "click",
        event=>{

            const button =
                event.target.closest(
                    "[data-delete]"
                );

            if(!button){
                return;
            }

            const index =
                Number(
                    button.dataset.delete
                );

            specialDays.splice(
                index,
                1
            );

            saveJSON(
                STORAGE.special,
                specialDays
            );

            renderSpecialDays();
        }
    );

/* =========================
   SOHBET
========================= */

async function askAI(
    text
){

    if(
        typeof puter === "undefined" ||
        !puter.ai ||
        typeof puter.ai.chat !==
            "function"
    ){

        throw new Error(
            "AI servisi hazır değil."
        );
    }

    const response =
        await puter.ai.chat(
            [
                {
                    role:"system",
                    content:`
Sen AURA'sın.

Kullanıcı:
${USER_NAME}

Sevgilisi:
${GIRLFRIEND_NAME}

Türkçe cevap ver.
Kısa, doğal ve doğru cevaplar ver.
Bilmediğin şeyi uydurma.

Kayıtlı bilgiler:
${memories
    .slice(-30)
    .map(
        x =>
            x.key+
            ": "+
            x.value
    )
    .join("\n")}
`
                },

                ...history.slice(-10),

                {
                    role:"user",
                    content:text
                }
            ]
        );

    if(
        typeof response ===
            "string"
    ){
        return response;
    }

    if(
        response?.message?.content
    ){

        if(
            typeof response.message.content ===
                "string"
        ){

            return response.message.content;
        }

        if(
            Array.isArray(
                response.message.content
            )
        ){

            return response.message.content
                .map(
                    x =>
                        typeof x ===
                            "string"
                            ? x
                            : x?.text || ""
                )
                .join("");
        }
    }

    return (
        response?.text ||
        "AURA cevap oluşturamadı."
    );
}

async function sendMessage(){

    const text =
        userInput.value.trim();

    if(!text){
        return;
    }

    userInput.value = "";

    addMessage(
        text,
        "user"
    );

    typing.classList.add(
        "show"
    );

    try{

        const answer =
            await askAI(
                text
            );

        addMessage(
            answer,
            "aura"
        );

        history.push(
            {
                role:"user",
                content:text
            },
            {
                role:"assistant",
                content:answer
            }
        );

        saveJSON(
            STORAGE.history,
            history.slice(-40)
        );

    }catch(error){

        console.error(
            error
        );

        addMessage(
            "AURA şu anda cevap oluşturamadı.",
            "aura"
        );

    }finally{

        typing.classList.remove(
            "show"
        );

        scrollChat();
    }
}

sendButton.addEventListener(
    "click",
    sendMessage
);

userInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);

/* =========================
   PANEL SÜRÜKLEME
========================= */

let dragStartY = null;

chatPanel.addEventListener(
    "touchstart",
    event=>{

        dragStartY =
            event.touches[0].clientY;
    },
    {
        passive:true
    }
);

chatPanel.addEventListener(
    "touchend",
    event=>{

        if(
            dragStartY === null
        ){
            return;
        }

        const endY =
            event.changedTouches[0]
                .clientY;

        const difference =
            endY -
            dragStartY;

        dragStartY = null;

        if(
            difference > 70
        ){

            closeChat();
        }
    },
    {
        passive:true
    }
);

/* =========================
   BAŞLANGIÇ
========================= */

addMessage(
    "Selam Edanur. AURA hazır.",
    "aura"
);

renderStories();

renderSpecialDays();

console.log(
    "AURA EDANUR sürümü hazır."
);

</script>
