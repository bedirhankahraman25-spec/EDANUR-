<!DOCTYPE html>
<html lang="tr">
<head>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#ffd1e8;
    background:
    radial-gradient(circle at 50% 25%,#68194f 0%,#350b2b 28%,#16000f 62%,#040003 100%);
    position:relative;
}

body:before{
    content:"";
    position:fixed;
    width:320px;
    height:320px;
    top:-80px;
    left:-100px;
    border-radius:50%;
    background:rgba(255,80,170,.18);
    filter:blur(75px);
    pointer-events:none;
}

body:after{
    content:"";
    position:fixed;
    width:330px;
    height:330px;
    right:-120px;
    bottom:-80px;
    border-radius:50%;
    background:rgba(190,80,255,.16);
    filter:blur(85px);
    pointer-events:none;
}

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff4fb;
    box-shadow:0 0 6px #ff69b4,0 0 13px #ff69b4;
    animation:twinkle 2.5s infinite ease-in-out;
}

.star:nth-child(1){top:10%;left:12%}
.star:nth-child(2){top:18%;left:82%;animation-delay:.4s}
.star:nth-child(3){top:35%;left:7%;animation-delay:.9s}
.star:nth-child(4){top:43%;left:91%;animation-delay:1.4s}
.star:nth-child(5){top:8%;left:55%;animation-delay:.7s}
.star:nth-child(6){top:55%;left:17%;animation-delay:1.7s}
.star:nth-child(7){top:30%;left:72%;animation-delay:.2s}
.star:nth-child(8){top:67%;left:87%;animation-delay:1.1s}
.star:nth-child(9){top:75%;left:8%;animation-delay:1.8s}
.star:nth-child(10){top:82%;left:75%;animation-delay:.5s}

@keyframes twinkle{
    0%,100%{opacity:.25;transform:scale(.7)}
    50%{opacity:1;transform:scale(1.5)}
}

.princess-decor{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.gem{
    position:absolute;
    width:7px;
    height:7px;
    transform:rotate(45deg);
    background:#fff3fa;
    box-shadow:0 0 5px #fff,0 0 12px #ff9dce,0 0 22px #ff69b4;
    opacity:.65;
    animation:gemFloat 4s infinite ease-in-out;
}

.gem1{top:16%;left:8%}
.gem2{top:24%;right:9%;animation-delay:1.2s}
.gem3{bottom:25%;left:11%;animation-delay:2s}
.gem4{bottom:18%;right:13%;animation-delay:.7s}

.pearl{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff7fc;
    box-shadow:0 0 7px #fff,0 0 14px #ffc4e2;
    animation:pearlGlow 3s infinite ease-in-out;
}

.pearl1{top:31%;left:23%}
.pearl2{top:13%;right:28%;animation-delay:.8s}
.pearl3{bottom:31%;right:25%;animation-delay:1.5s}
.pearl4{bottom:14%;left:27%;animation-delay:2.2s}

.crown-glow{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    font-family:Georgia,serif;
    font-size:42px;
    color:rgba(255,220,240,.16);
    text-shadow:0 0 12px rgba(255,105,180,.4),0 0 30px rgba(255,20,147,.25);
    animation:crownGlow 4s infinite ease-in-out;
}

@keyframes gemFloat{
    0%,100%{opacity:.3;transform:rotate(45deg) scale(.7)}
    50%{opacity:1;transform:rotate(45deg) scale(1.25)}
}

@keyframes pearlGlow{
    0%,100%{opacity:.25;transform:scale(.7)}
    50%{opacity:1;transform:scale(1.5)}
}

@keyframes crownGlow{
    0%,100%{opacity:.35;transform:translateX(-50%) scale(.95)}
    50%{opacity:.8;transform:translateX(-50%) scale(1.05)}
}

.top-bar{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(15,0,12,.86);
    border-bottom:1px solid rgba(255,105,180,.35);
    backdrop-filter:blur(12px);
    position:relative;
    z-index:5;
}

.logo{
    font-family:Georgia,serif;
    font-size:22px;
    font-weight:bold;
    letter-spacing:4px;
    color:#ffd6eb;
    text-shadow:0 0 8px #ff69b4,0 0 20px #ff1493;
}

.status{
    font-size:10px;
    letter-spacing:2px;
    color:#ffafd2;
}

.status:before{
    content:"";
    display:inline-block;
    width:7px;
    height:7px;
    margin-right:7px;
    border-radius:50%;
    background:#ff69b4;
    box-shadow:0 0 7px #ff1493,0 0 14px #ff1493;
}

.main{
    height:calc(100vh - 60px);
    height:calc(100dvh - 60px);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
    position:relative;
    z-index:2;
}

.heart-area{
    width:230px;
    height:205px;
    margin-top:5px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.heart-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(255,140,200,.38);
    box-shadow:0 0 8px rgba(255,80,170,.15);
}

.ring1{
    width:135px;
    height:135px;
    border-left-color:transparent;
    border-right-color:transparent;
    animation:rotate1 9s linear infinite;
}

.ring2{
    width:170px;
    height:170px;
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:rotate2 13s linear infinite;
}

.ring3{
    width:205px;
    height:205px;
    border-left-color:transparent;
    border-bottom-color:transparent;
    animation:rotate1 17s linear infinite;
}

.heart{
    width:88px;
    height:88px;
    position:relative;
    transform:rotate(-45deg);
    background:linear-gradient(135deg,#ff9ed0,#ff3f9e 45%,#e60073);
    border-radius:9px;
    box-shadow:0 0 10px #ff69b4,0 0 25px rgba(255,20,147,.8),0 0 50px rgba(255,20,147,.45);
    animation:heartbeat 1.9s infinite ease-in-out;
    z-index:5;
}

.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:88px;
    height:88px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff9ed0,#ff3f9e 45%,#e60073);
}

.heart:before{
    top:-44px;
    left:0;
}

.heart:after{
    top:0;
    left:44px;
}

.heart-text{
    position:absolute;
    z-index:20;
    width:125px;
    left:-18px;
    top:36px;
    transform:rotate(45deg);
    text-align:center;
    color:#fff7fb;
    font-family:Georgia,"Times New Roman",serif;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
    line-height:1.25;
    white-space:nowrap;
    text-shadow:0 0 4px #fff,0 0 9px #ffb6d9,0 0 15px #ff69b4;
    pointer-events:none;
}

@keyframes heartbeat{
    0%,100%{transform:rotate(-45deg) scale(1)}
    50%{transform:rotate(-45deg) scale(1.07)}
}

@keyframes rotate1{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes rotate2{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}

<script src="https://js.puter.com/v2/"></script><script>

/* =====================================================
   ELEMANLAR
===================================================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const statusElement =
    document.getElementById("status");

const emojiButton =
    document.getElementById("emojiButton");

const attachButton =
    document.getElementById("attachButton");

const heartButton =
    document.getElementById("heartButton");

const fileInput =
    document.getElementById("fileInput");


/* =====================================================
   HAFIZA
===================================================== */

const MEMORY_KEY =
    "EDANUR_AURA_MEMORY_V3";

const CHAT_KEY =
    "EDANUR_AURA_CHAT_V3";


function getMemory(){

    try{

        return JSON.parse(
            localStorage.getItem(
                MEMORY_KEY
            )
        ) || {
            facts:[],
            notes:[]
        };

    }catch(e){

        return {
            facts:[],
            notes:[]
        };

    }

}


let memory =
    getMemory();


function saveMemory(){

    localStorage.setItem(
        MEMORY_KEY,
        JSON.stringify(memory)
    );

}


function memoryText(){

    let text = "";

    if(memory.facts.length){

        text +=
            "Bilinen bilgiler:\n";

        memory.facts.forEach(
            x => {
                text +=
                    "- " +
                    x +
                    "\n";
            }
        );

    }

    if(memory.notes.length){

        text +=
            "\nNotlar:\n";

        memory.notes.forEach(
            x => {
                text +=
                    "- " +
                    x +
                    "\n";
            }
        );

    }

    return text ||
        "Kayıtlı bilgi yok.";

}


/* =====================================================
   SOHBET GEÇMİŞİ
===================================================== */

function getConversation(){

    try{

        return JSON.parse(
            localStorage.getItem(
                CHAT_KEY
            )
        ) || [];

    }catch(e){

        return [];

    }

}


let conversation =
    getConversation();


function saveConversation(){

    conversation =
        conversation.slice(-20);

    try{

        localStorage.setItem(
            CHAT_KEY,
            JSON.stringify(
                conversation
            )
        );

    }catch(e){

        console.error(e);

    }

}


/* =====================================================
   MESAJ GÖSTER
===================================================== */

function addMessage(
    text,
    type
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " +
        type;

    div.textContent =
        String(text);

    chat.appendChild(
        div
    );

    chat.scrollTop =
        chat.scrollHeight;

    return div;

}


/* =====================================================
   AURA PROMPT
===================================================== */

function systemPrompt(){

    return `

Sen AURA adında kişisel bir yapay zeka asistanısın.

Türkçe konuş.

Doğal ve anlaşılır cevaplar ver.

Kullanıcının adını sürekli tekrar etme.

Kullanıcı özellikle istemedikçe
"Bedirhan Kahraman" diye hitap etme.

Sen Edanur için hazırlanmış özel bir asistansın.

Kayıtlı hafıza:

${memoryText()}

`;

}


/* =====================================================
   AI
===================================================== */

async function askAI(text){

    if(
        typeof puter ===
        "undefined"
    ){

        throw new Error(
            "Puter yüklenemedi."
        );

    }


    const messages = [

        {
            role:"system",
            content:
                systemPrompt()
        },

        ...conversation.slice(-10),

        {
            role:"user",
            content:text
        }

    ];


    /*
       ÖNEMLİ:
       Burada web_search kullanmıyoruz.

       Öncelik:
       NORMAL MESAJ GÖNDERİMİNİ
       stabil hale getirmek.
    */

    const response =
        await puter.ai.chat(
            messages
        );


    let answer = "";


    if(
        response &&
        response.message &&
        typeof response.message.content ===
        "string"
    ){

        answer =
            response.message.content;

    }

    else if(
        response &&
        typeof response.text ===
        "string"
    ){

        answer =
            response.text;

    }

    else if(
        typeof response ===
        "string"
    ){

        answer =
            response;

    }

    else if(
        response &&
        response.message
    ){

        answer =
            String(
                response.message.content ||
                ""
            );

    }


    answer =
        answer.trim();


    if(!answer){

        throw new Error(
            "AURA boş cevap verdi."
        );

    }


    return answer;

}


/* =====================================================
   HAFIZA KOMUTLARI
===================================================== */

function memoryCommand(text){

    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    const noteMatch =
        text.match(
            /^(?:not al|not kaydet|bunu not al)\s*:?\s*(.+)$/i
        );


    if(noteMatch){

        memory.notes.push(
            noteMatch[1].trim()
        );

        saveMemory();


        return {
            handled:true,
            response:
                "Tamam, bunu notlarıma kaydettim."
        };

    }


    const rememberMatch =
        text.match(
            /^(?:bunu hatırla|bunu hafızana al|bunu unutma)\s*:?\s*(.+)$/i
        );


    if(rememberMatch){

        memory.facts.push(
            rememberMatch[1].trim()
        );

        saveMemory();


        return {
            handled:true,
            response:
                "Tamam, bunu hafızama ekledim."
        };

    }


    if(
        lower ===
        "hafızamda ne var"
        ||
        lower ===
        "hafizamda ne var"
    ){

        return {
            handled:true,
            response:
                memoryText()
        };

    }


    if(
        lower ===
        "hafızayı temizle"
        ||
        lower ===
        "hafizayi temizle"
    ){

        memory = {
            facts:[],
            notes:[]
        };

        saveMemory();


        return {
            handled:true,
            response:
                "Hafızayı temizledim."
        };

    }


    return {
        handled:false
    };

}


/* =====================================================
   YEREL KOMUTLAR
===================================================== */

function localCommand(text){

    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    if(
        lower ===
        "selam"
        ||
        lower ===
        "merhaba"
    ){

        return {
            handled:true,
            response:
                "Merhaba. Ben AURA."
        };

    }


    if(
        lower.includes(
            "saat kaç"
        )
        ||
        lower.includes(
            "saat kac"
        )
    ){

        return {
            handled:true,
            response:
                "Saat şu anda " +
                new Date()
                    .toLocaleTimeString(
                        "tr-TR",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    ) +
                "."
        };

    }


    return {
        handled:false
    };

}


/* =====================================================
   AURA KELİMESİNİ TEMİZLE
===================================================== */

function cleanInput(text){

    return String(text)
        .replace(
            /^\s*aura[\s,:-]*/i,
            ""
        )
        .trim();

}


/* =====================================================
   SESLİ CEVAP
===================================================== */

function speak(text){

    if(
        !window.speechSynthesis
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            String(text)
                .replace(
                    /[*_#`]/g,
                    ""
                )
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        .95;

    utterance.pitch =
        1.05;

    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   GÖNDERME
===================================================== */

let sending =
    false;


async function sendMessage(
    voiceMode = false
){

    if(sending){

        return;

    }


    let text =
        input.value.trim();


    if(!text){

        input.focus();

        return;

    }


    text =
        cleanInput(text);


    if(!text){

        return;

    }


    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    const memoryResult =
        memoryCommand(
            text
        );


    if(
        memoryResult.handled
    ){

        addMessage(
            memoryResult.response,
            "aura"
        );


        conversation.push(
            {
                role:"user",
                content:text
            },
            {
                role:"assistant",
                content:
                    memoryResult.response
            }
        );


        saveConversation();


        if(voiceMode){

            speak(
                memoryResult.response
            );

        }


        return;

    }


    const local =
        localCommand(
            text
        );


    if(local.handled){

        addMessage(
            local.response,
            "aura"
        );


        conversation.push(
            {
                role:"user",
                content:text
            },
            {
                role:"assistant",
                content:
                    local.response
            }
        );


        saveConversation();


        if(voiceMode){

            speak(
                local.response
            );

        }


        return;

    }


    sending =
        true;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    statusElement.textContent =
        "THINKING";


    const loading =
        addMessage(
            "Düşünüyorum...",
            "aura"
        );


    try{

        const answer =
            await askAI(
                text
            );


        loading.remove();


        addMessage(
            answer,
            "aura"
        );


        conversation.push(
            {
                role:"user",
                content:text
            },
            {
                role:"assistant",
                content:answer
            }
        );


        saveConversation();


        if(voiceMode){

            speak(answer);

        }


        statusElement.textContent =
            "ONLINE";

    }
    catch(error){

        console.error(
            "AURA:",
            error
        );


        loading.remove();


        const errorMessage =
            "Bağlantıda bir sorun oluştu. Tekrar deneyelim.";


        addMessage(
            errorMessage,
            "aura"
        );


        statusElement.textContent =
            "ERROR";

    }


    sending =
        false;

    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();

}<script>

/* =====================================================
   GÖNDER BUTONU
===================================================== */

sendButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        sendMessage(false);

    }
);


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage(false);

        }

    }
);


/* =====================================================
   MİKROFON
===================================================== */

let recognition =
    null;

let listening =
    false;


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            listening =
                true;

            micButton.textContent =
                "🔴";

            statusElement.textContent =
                "LISTENING";

        };


    recognition.onresult =
        function(event){

            const result =
                event.results[0][0];


            if(!result){

                return;

            }


            const text =
                result.transcript.trim();


            if(!text){

                return;

            }


            input.value =
                text;


            sendMessage(true);

        };


    recognition.onerror =
        function(event){

            console.error(
                "Mikrofon:",
                event.error
            );

            listening =
                false;

            micButton.textContent =
                "🎤";

            statusElement.textContent =
                "ONLINE";

        };


    recognition.onend =
        function(){

            listening =
                false;

            micButton.textContent =
                "🎤";

            if(
                statusElement.textContent ===
                "LISTENING"
            ){

                statusElement.textContent =
                    "ONLINE";

            }

        };

}


/* =====================================================
   MİKROFON BUTONU
===================================================== */

micButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();


        if(!recognition){

            addMessage(
                "Bu tarayıcı sesli konuşmayı desteklemiyor.",
                "aura"
            );

            return;

        }


        if(listening){

            try{

                recognition.stop();

            }catch(e){}

            return;

        }


        try{

            recognition.start();

        }
        catch(error){

            console.error(
                error
            );

        }

    }
);


/* =====================================================
   EMOJI
===================================================== */

emojiButton.addEventListener(
    "click",
    function(){

        input.value +=
            " ❤️";

        input.focus();

    }
);


/* =====================================================
   DOSYA
===================================================== */

attachButton.addEventListener(
    "click",
    function(){

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    function(){

        if(
            !fileInput.files ||
            !fileInput.files.length
        ){

            return;

        }


        const file =
            fileInput.files[0];


        addMessage(
            "📎 " +
            file.name +
            " seçildi.",
            "user"
        );


        fileInput.value =
            "";

    }
);


/* =====================================================
   KALP
===================================================== */

heartButton.addEventListener(
    "click",
    function(){

        input.value =
            "Seni seviyorum ❤️";

        input.focus();

    }
);


/* =====================================================
   ESKİ SOHBETİ YÜKLE
===================================================== */

if(
    conversation.length
){

    conversation
        .slice(-10)
        .forEach(
            function(message){

                if(
                    message.role ===
                    "user"
                ){

                    addMessage(
                        message.content,
                        "user"
                    );

                }

                else if(
                    message.role ===
                    "assistant"
                ){

                    addMessage(
                        message.content,
                        "aura"
                    );

                }

            }
        );

}
else{

    addMessage(
        "Merhaba. Ben AURA. Hazırım. ❤️",
        "aura"
    );

}


statusElement.textContent =
    "ONLINE";


input.focus();


/* =====================================================
   HATALARI KONSOLA YAZ
===================================================== */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "AURA GLOBAL:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "AURA PROMISE:",
            event.reason
        );

    }
);

</script>

</body>
</html>
