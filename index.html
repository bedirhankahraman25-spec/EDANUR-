<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AURA ♥ EDANUR</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;color:#ffe6f3;background:radial-gradient(circle at 50% 30%,#74134f 0%,#35071f 32%,#10000b 72%,#030003 100%)}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
.glow.one{width:300px;height:300px;background:#ff258f;left:-120px;top:80px}
.glow.two{width:330px;height:330px;background:#a000ff;right:-130px;bottom:50px}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #ff69b4;animation:twinkle 2.5s infinite}
.s1{top:12%;left:9%}.s2{top:20%;left:83%;animation-delay:.5s}
.s3{top:34%;left:17%}.s4{top:42%;right:10%;animation-delay:1.5s}
.s5{top:67%;left:8%}.s6{top:74%;right:14%;animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.5)}}

.app{position:relative;width:100%;height:100%;z-index:2}
.top{position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(12,0,10,.76);border-bottom:1px solid rgba(255,92,175,.38);backdrop-filter:blur(14px);z-index:20}
.logo{display:flex;align-items:center;gap:10px}
.crown{color:#ff8ac5;font-size:20px;text-shadow:0 0 10px #ff1493}
.logoText{font-family:Georgia,serif;font-size:24px;letter-spacing:4px;color:#fff0f8;text-shadow:0 0 8px #ff69b4,0 0 20px #ff1493}
.status{font-size:10px;letter-spacing:2px;color:#ffc0dc}
.statusDot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#ff4fa8;box-shadow:0 0 9px #ff1493}

.center{position:absolute;top:58px;left:0;right:0;bottom:118px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.heartSystem{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center}
.orbit{position:absolute;border:1px solid rgba(255,110,185,.4);border-radius:50%}
.orbit1{width:145px;height:145px;animation:spin 9s linear infinite}
.orbit2{width:180px;height:180px;border-top-color:transparent;border-bottom-color:transparent;animation:spinReverse 13s linear infinite}
.heart{position:relative;width:86px;height:86px;transform:rotate(-45deg);background:linear-gradient(135deg,#ffb5da,#ff4ca7 48%,#df006e);border-radius:9px;box-shadow:0 0 12px #ff8aca,0 0 28px #ff1493,0 0 55px rgba(255,20,147,.65);animation:heartbeat 1.8s infinite ease-in-out}
.heart:before,.heart:after{content:"";position:absolute;width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#ffb5da,#ff4ca7 48%,#df006e)}
.heart:before{top:-43px;left:0}.heart:after{top:0;left:43px}
.heartText{position:absolute;z-index:5;width:125px;left:-20px;top:34px;transform:rotate(45deg);text-align:center;color:white;font-family:Georgia,serif;font-size:15px;font-weight:bold;line-height:1.25;letter-spacing:2px;text-shadow:0 0 4px white,0 0 10px #ffb5dc}
@keyframes heartbeat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.08)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spinReverse{from{transform:rotate(360deg)}to{transform:rotate(0)}}
       .chatArea{position:absolute;left:0;right:0;top:58px;bottom:118px;padding:12px max(12px,calc((100% - 720px)/2));overflow-y:auto;scrollbar-width:none;z-index:5}
.chatArea::-webkit-scrollbar{display:none}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.message{max-width:78%;padding:10px 14px;border-radius:17px;font-size:14px;line-height:1.4;word-break:break-word;white-space:pre-wrap}
.auraMessage{align-self:flex-start;background:rgba(48,3,32,.86);border:1px solid rgba(255,105,180,.25)}
.userMessage{align-self:flex-end;background:linear-gradient(135deg,#a91465,#e43c91);border:1px solid rgba(255,170,215,.3)}
.typing{opacity:.7;font-style:italic}

.periodButton,.specialButton,.moodButton{position:absolute;width:42px;height:42px;border:1px solid rgba(255,120,190,.4);border-radius:50%;background:rgba(40,0,27,.88);color:#ffb6d8;font-size:19px;cursor:pointer;z-index:25;box-shadow:0 0 15px rgba(255,20,147,.22)}
.periodButton{right:14px;bottom:122px}
.specialButton{right:64px;bottom:122px}
.moodButton{right:114px;bottom:122px}
.periodButton:active,.specialButton:active,.moodButton:active{transform:scale(.91)}

.overlay{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px;background:rgba(0,0,0,.58);backdrop-filter:blur(5px);z-index:100}
.overlay.show{display:flex}
.panel{width:min(480px,100%);max-height:88vh;overflow-y:auto;padding:18px;border-radius:24px;background:linear-gradient(145deg,rgba(71,4,43,.99),rgba(25,0,17,.99));border:1px solid rgba(255,120,190,.38);box-shadow:0 0 35px rgba(255,20,147,.25);scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.panelHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.panelTitle{font-family:Georgia,serif;font-size:19px;color:#ffd5e8}
.closeButton{width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#ffc5df;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:5px;margin-bottom:15px;overflow-x:auto}
.tab{flex:1;min-width:75px;height:38px;border:1px solid rgba(255,105,180,.22);border-radius:12px;background:rgba(255,255,255,.05);color:#ffc7df;font-size:11px;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,rgba(255,104,181,.38),rgba(190,0,105,.45));border-color:rgba(255,130,195,.5)}
.tabContent{display:none}.tabContent.active{display:block}

.input,.textarea{width:100%;padding:10px;border:1px solid rgba(255,105,180,.25);border-radius:13px;outline:0;background:rgba(255,255,255,.06);color:white;font-size:13px;margin-bottom:8px}
.saveButton{width:100%;height:42px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff76ba,#d40070);color:white;font-weight:bold;font-size:14px;cursor:pointer}
.cardItem{position:relative;padding:12px;margin-bottom:10px;border-radius:15px;background:rgba(255,255,255,.055);border:1px solid rgba(255,105,180,.17)}
.audioPlayer{width:100%;margin-top:8px;height:36px;border-radius:8px}
.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.photoCard{background:rgba(255,255,255,.05);border-radius:12px;padding:8px;border:1px solid rgba(255,105,180,.2)}
.photoCard img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.quizOption{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid rgba(255,105,180,.3);background:rgba(255,255,255,.08);color:white;text-align:left;cursor:pointer}
.quizOption:hover{background:rgba(255,105,180,.3)}
.moodGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.moodItem{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,105,180,.2);text-align:center;cursor:pointer}
.moodItem:hover{background:rgba(255,105,180,.25)}

.bottom{position:absolute;left:0;right:0;bottom:0;height:110px;padding:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(to top,rgba(9,0,7,.98),rgba(20,0,14,.94));border-top:1px solid rgba(255,92,175,.42);backdrop-filter:blur(16px);z-index:30}
.inputBar{width:min(720px,100%);height:58px;display:flex;align-items:center;gap:7px;padding:7px;border:1px solid rgba(255,91,173,.4);border-radius:30px;background:rgba(30,0,20,.92)}
.iconButton{width:43px;height:43px;flex:0 0 43px;border:1px solid rgba(255,105,180,.3);border-radius:50%;background:rgba(255,90,170,.09);color:#ffc4df;font-size:19px;cursor:pointer}
.textInput{min-width:0;flex:1;height:43px;padding:0 12px;border:0;outline:0;border-radius:18px;background:rgba(255,255,255,.045);color:white;font-size:14px}
.actionButton{width:45px;height:45px;flex:0 0 45px;border:0;border-radius:50%;background:linear-gradient(135deg,#ff77bb,#d40070);color:white;font-size:20px;cursor:pointer}
</style>
</head>

<div class="app">

<script src="https://js.puter.com/v2/"></script>
     <script>
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const chat = document.getElementById("chat");
const chatArea = document.getElementById("chatArea");
const statusText = document.getElementById("statusText");

let busy = false;

function addMessage(text, type){
  const message = document.createElement("div");
  message.className = "message " + (type === "user" ? "userMessage" : "auraMessage");
  message.textContent = String(text);
  chat.appendChild(message);
  chatArea.scrollTop = chatArea.scrollHeight;
  return message;
}

window.addEventListener("load", () => {
  addMessage("Merhaba Edanur, sistem hazır. ❤️", "aura");
  loadStories();
  loadPhotos();
  initQuiz();
  loadPeriodData();
});

async function askAura(text, moodContext = ""){
  if(typeof puter === "undefined" || !puter.ai || !puter.ai.chat){
    throw new Error("Puter AI hazır değil.");
  }

  const prompt = `
Sen AURA adında gelişmiş, yüksek duygusal zekaya sahip ve mantıklı bir yapay zeka asistanısın.

SİSTEM VE KİMLİK BİLGİLERİ:
- Sen BEDİRHAN KAHRAMAN tarafından özel olarak geliştirildin.
- Senin tek varoluş amacın BEDİRHAN'ın sevgilisi EDANUR'a hizmet etmek, onun hayatını neşelendirmek ve ona yardımcı olmaktır.
- Kullanıcının adı EDANUR.
- Edanur'un sevgilisi BEDİRHAN KAHRAMAN'dır (senin sahibin ve geliştiricin).
- Edanur sana Bedirhan veya ilişkiniz hakkında sorular sorarsa son derece nazik, destekleyici ve doğru cevaplar ver. Bedirhan hakkında bilmediğin şeyleri uydurma.
- Edanur seninle dertleşebilir, tavsiye isteyebilir. Onu empatiyle dinle ve gerçekçi, samimi yanıtlar ver.
${moodContext ? `[Edanur'un Şu Anki Ruh Hali: ${moodContext}] Ona bu duygusal durumuna uygun hassasiyetle yaklaş.` : ""}

DAVRANIŞ KURALLARI:
- Her zaman Türkçe konuş.
- Asla yapay bir bot gibi hissettirme; doğal, sıcak, mantıklı ve sevgi dolu konuş.
- Cümlelerinde gereksiz uzatmalardan kaçın.

Edanur'un Mesajı:
${text}
  `;

  const response = await puter.ai.chat(prompt);
  if(!response) throw new Error("Boş cevap.");
  return typeof response === "string" ? response.trim() : (response.message?.content || response.text || String(response)).trim();
}
    async function sendMessage(overrideText = "", moodContext = ""){
  if(busy) return;
  const text = overrideText || input.value.trim();
  if(!text) return;

  if(!overrideText) addMessage(text, "user");
  input.value = "";
  busy = true;
  sendButton.disabled = true;
  micButton.disabled = true;
  statusText.textContent = "DÜŞÜNÜYOR";

  const typing = addMessage("AURA düşünüyor...", "aura");
  typing.classList.add("typing");

  try{
    const answer = await askAura(text, moodContext);
    typing.remove();
    addMessage(answer, "aura");
    statusText.textContent = "ONLINE";
  }catch(error){
    console.error("AURA Hatası:", error);
    typing.remove();
    addMessage("Bağlantıda küçük bir aksama oldu Edanur, tekrar dener misin?", "aura");
    statusText.textContent = "BAĞLANTI HATASI";
  }
  busy = false;
  sendButton.disabled = false;
  micButton.disabled = false;
  input.focus();
}

sendButton.onclick = (e) => { e.preventDefault(); sendMessage(); };
input.onkeydown = (e) => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); } };
document.getElementById("heartButton").onclick = () => { input.value = "Seni seviyorum ❤️"; input.focus(); };

let recognition = null;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = "tr-TR";
  recognition.onstart = () => { micButton.textContent = "🔴"; statusText.textContent = "DİNLİYOR"; };
  recognition.onresult = (e) => {
    if(e.results && e.results[0]){
      input.value = e.results[0][0].transcript.trim();
      sendMessage();
    }
  };
  recognition.onend = () => { micButton.textContent = "🎤"; statusText.textContent = "ONLINE"; };
  micButton.onclick = () => { try{ recognition.start(); }catch(err){} };
} else {
  micButton.onclick = () => addMessage("Tarayıcınız sesli konuşmayı desteklemiyor.", "aura");
        }
           /* MASALLAR BÖLÜMÜ (SES LİNKİ VE DOSYA DESTEKLİ BULUT KODU) */
async function loadStories(){
  const list = document.getElementById("storyList");
  list.innerHTML = "<div class='cardItem' style='font-size:12px;color:#aaa;'>Masallar yükleniyor...</div>";
  
  try {
    let stories = await puter.kv.get("auraStories");
    stories = stories ? JSON.parse(stories) : [];
    
    list.innerHTML = "";
    if(stories.length === 0){
      list.innerHTML = "<div class='cardItem' style='font-size:12px;color:#aaa;'>Henüz masal eklenmemiş. Yüklediğin an Edanur'un ekranında görünecek!</div>";
      return;
    }

    stories.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "cardItem";
      div.innerHTML = `
        <div style="font-weight:bold;color:#ffe0ed;">📖 ${item.title}</div>
        <div style="font-size:10px;color:#ffb8d8;">Bedirhan'ın Sesinden • ${item.date}</div>
        <audio controls class="audioPlayer" src="${item.audioData}"></audio>
        <button onclick="deleteStory(${index})" style="position:absolute;right:10px;top:10px;border:0;background:transparent;color:#ff4f8f;cursor:pointer;font-weight:bold;">✕</button>
      `;
      list.appendChild(div);
    });
  } catch(err) {
    list.innerHTML = "<div class='cardItem' style='font-size:12px;color:#aaa;'>Masallar yüklenirken bir hata oluştu.</div>";
  }
}

document.getElementById("addStoryBtn").onclick = async () => {
  const title = document.getElementById("storyTitle").value.trim();
  const urlInput = document.getElementById("storyAudioUrl").value.trim();
  const fileInput = document.getElementById("storyAudioFile");

  if(!title){
    alert("Lütfen masal başlığı yazın!");
    return;
  }

  // 1. Ses Linki Girildiyse
  if(urlInput){
    await saveStoryToCloud(title, urlInput);
    document.getElementById("storyAudioUrl").value = "";
    return;
  }

  // 2. Doğrudan Dosya Seçildiyse (Max 2MB)
  if(fileInput.files[0]){
    const file = fileInput.files[0];
    if(file.size > 2 * 1024 * 1024){
      alert("Seçtiğin dosya 2MB'tan büyük! Lütfen sesi Vocaroo.com'a yükleyip linkini üstteki alana yapıştırın.");
      return;
    }

    const reader = new FileReader();
    reader.onload = async (e) => {
      await saveStoryToCloud(title, e.target.result);
    };
    reader.readAsDataURL(file);
  } else {
    alert("Lütfen bir ses linki girin veya ses dosyası seçin!");
  }
};

async function saveStoryToCloud(title, audioSrc){
  try {
    let stories = await puter.kv.get("auraStories");
    stories = stories ? JSON.parse(stories) : [];
    stories.push({ title: title, audioData: audioSrc, date: new Date().toLocaleDateString("tr-TR") });
    await puter.kv.set("auraStories", JSON.stringify(stories));
    
    document.getElementById("storyTitle").value = "";
    document.getElementById("storyAudioFile").value = "";
    loadStories();
    alert("Masal başarıyla buluta kaydedildi!");
  } catch(err) {
    alert("Bulut hafıza sınırı aşıldı! Ses linki (Vocaroo vb.) kullanmanız önerilir.");
  }
}

async function deleteStory(index){
  try {
    let stories = await puter.kv.get("auraStories");
    stories = stories ? JSON.parse(stories) : [];
    stories.splice(index, 1);
    await puter.kv.set("auraStories", JSON.stringify(stories));
    loadStories();
  } catch(err) {}
}

  const reader = new FileReader();
  reader.onload = (e) => {

    localStorage.setItem("auraPhotos", JSON.stringify(photos));
    document.getElementById("photoTitle").value = "";

    loadPhotos();
  };

};

  localStorage.setItem("auraPhotos", JSON.stringify(photos));

}

/* MİNİ OYUN: BEDİRHAN QUIZ */
const quizData = [
  { q: "Bedirhan'ın hayattaki en değerli varlığı kimdir?", a: ["Edanur", "Arabası", "Telefonu"], correct: 0 },
  { q: "AURA'yı senin için kim geliştirdi?", a: ["Siri", "Bedirhan Kahraman", "Google"], correct: 1 },
  { q: "Bedirhan seni ne kadar çok seviyor?", a: ["Çok", "Dünyalar kadar", "Sonsuza dek 3000"], correct: 2 }
];
let currentQ = 0;

function initQuiz(){
  if(currentQ >= quizData.length){
    document.getElementById("quizQuestion").textContent = "Test Tamamlandı! 🎉";
    document.getElementById("quizOptions").innerHTML = "";
    document.getElementById("quizResult").textContent = "Sonuç: Bedirhan seni her şeyden çok seviyor!";
    return;
  }
  const q = quizData[currentQ];
  document.getElementById("quizQuestion").textContent = q.q;
  const opts = document.getElementById("quizOptions");
  opts.innerHTML = "";
  q.a.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "quizOption";
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById("quizResult").textContent = (idx === q.correct) ? "Harika! Doğru Cevap 💖" : "Fark etmez, Bedirhan seni yine çok seviyor! ❤️";
      currentQ++;
      setTimeout(initQuiz, 1200);
    };
    opts.appendChild(btn);
  });
}

/* REGL TAKİBİ */
const periodOverlay = document.getElementById("periodOverlay");
document.getElementById("periodButton").onclick = () => { periodOverlay.classList.add("show"); calculatePeriod(); };
document.getElementById("closePeriod").onclick = () => periodOverlay.classList.remove("show");

function calculatePeriod(){
  const savedDate = localStorage.getItem("auraPeriodDate");
  const savedCycle = parseInt(localStorage.getItem("auraPeriodCycle") || "28", 10);
  if(!savedDate){
    document.getElementById("periodDays").textContent = "Bilgi Yok";
    document.getElementById("periodDate").textContent = "Lütfen son regl tarihini kaydet.";
    return;
  }
  const parts = savedDate.split("-");
  const nextDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  nextDate.setDate(nextDate.getDate() + savedCycle);
  
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.ceil((nextDate.getTime() - today.getTime()) / 86400000);
  
  document.getElementById("periodDays").textContent = diff > 0 ? `${diff} Gün Kaldı` : (diff === 0 ? "Bugün Bekleniyor" : `${Math.abs(diff)} Gün Geçti`);
  document.getElementById("periodDate").textContent = "Tahmini Başlangıç: " + nextDate.toLocaleDateString("tr-TR");
}

function loadPeriodData(){
  const savedDate = localStorage.getItem("auraPeriodDate");
  if(savedDate) document.getElementById("lastPeriod").value = savedDate;
  calculatePeriod();
}

document.getElementById("periodSave").onclick = () => {
  const d = document.getElementById("lastPeriod").value;
  const c = document.getElementById("cycleLength").value;
  if(d){
    localStorage.setItem("auraPeriodDate", d);
    localStorage.setItem("auraPeriodCycle", c);
    calculatePeriod();
    setTimeout(() => periodOverlay.classList.remove("show"), 500);
  }
};
