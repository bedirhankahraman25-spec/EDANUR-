/* =========================

async function webSearch(query) {

    try {

        const cleanQuery =
            String(query)
                .trim();

        if (!cleanQuery) {

            return {
                success: false,
                text: "Aranacak bir şey belirtilmedi."
            };
        }


        /*
           DuckDuckGo Instant Answer API
        */

        const url =
            "https://api.duckduckgo.com/" +
            "?q=" +
            encodeURIComponent(
                cleanQuery
            ) +
            "&format=json" +
            "&no_html=1" +
            "&skip_disambig=1";


        const response =
            await fetch(
                url,
                {
                    method: "GET"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Web servisi yanıt vermedi."
            );
        }


        const data =
            await response.json();


        let results = [];


        if (
            data.AbstractText
        ) {

            results.push(
                data.AbstractText
            );
        }


        if (
            Array.isArray(
                data.RelatedTopics
            )
        ) {

            data.RelatedTopics
                .forEach(
                    function(item) {

                        if (
                            results.length >= 5
                        ) {
                            return;
                        }

                        if (
                            item &&
                            item.Text
                        ) {

                            results.push(
                                item.Text
                            );
                        }
                    }
                );
        }


        if (!results.length) {

            return {

                success: false,

                text:
                    "Bu arama için doğrudan sonuç bulamadım."
            };
        }


        return {

            success: true,

            text:
                results
                    .slice(0, 5)
                    .join("\n\n")
        };


    } catch (error) {

        console.error(
            "WEB ARAMA HATASI:",
            error
        );


        return {

            success: false,

            text:
                "Web aramasına şu anda erişemedim."
        };
    }
}

/* =========================
   ARAMA SORGUSU TEMİZLE

function createSearchQuery(
    text
) {

    let query =
        String(text)
            .trim();


    query =
        query.replace(
            /^(internette|internetten|webde|web'de|google'da|google da)\s*/i,
            ""
        );


    query =
        query.replace(
            /^(ara|araştır|araştırsana)\s*/i,
            ""
        );


    return query.trim();
}

async function getWeather(
    city
) {

    try {

        const location =
            String(city || "")
                .trim();


        if (!location) {

            return {

                success: false,

                text:
                    "Hangi şehir için hava durumuna bakmamı istediğini söyle."
            };
        }


        /*
           Open-Meteo geocoding
        */

        const geoUrl =
            "https://geocoding-api.open-meteo.com/" +
            "v1/search?name=" +
            encodeURIComponent(
                location
            ) +
            "&count=1&language=tr&format=json";


        const geoResponse =
            await fetch(
                geoUrl
            );


        if (!geoResponse.ok) {

            throw new Error(
                "Konum bulunamadı."
            );
        }


        const geoData =
            await geoResponse.json();


        if (
            !geoData.results ||
            !geoData.results.length
        ) {

            return {

                success: false,

                text:
                    location +
                    " için konum bulamadım."
            };
        }


        const place =
            geoData.results[0];


        const weatherUrl =
            "https://api.open-meteo.com/" +
            "v1/forecast" +
            "?latitude=" +
            place.latitude +
            "&longitude=" +
            place.longitude +
            "&current=" +
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m" +
            "&timezone=auto";


        const weatherResponse =
            await fetch(
                weatherUrl
            );


        if (!weatherResponse.ok) {

            throw new Error(

        const weather =

        );


        return {

            text:

        };
    }
}

           <script>

/* =========================
   PUTER AI BAĞLANTISI
========================= */

async function callPuterAI(
    messages
) {

    try {

        if (
            typeof puter === "undefined" ||
            !puter.ai ||
            typeof puter.ai.chat !==
            "function"
        ) {

            throw new Error(
                "Puter AI hazır değil."
            );
        }


        const response =
            await puter.ai.chat(
                messages,
                {
                    model:
                        "gpt-5.4-nano"
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            typeof response.message.content ===
            "string"
        ) {

            answer =
                response.message.content;
        }

        else if (
            response &&
            typeof response.text ===
            "string"
        ) {

            answer =
                response.text;
        }

        else if (
            typeof response ===
            "string"
        ) {

            answer =
                response;
        }

        else {

            answer =
                String(response);
        }


        answer =
            answer.trim();


        if (!answer) {

            throw new Error(
                "AI boş cevap verdi."
            );
        }


        return answer;


    } catch (error) {

        console.error(
            "AURA AI HATASI:",
            error
        );


        throw error;
    }
}


/* =========================
   NORMAL AI SORGUSU
========================= */

async function askAI(
    userText
) {

    const messages = [

        {
            role: "system",

            content:
                buildSystemPrompt()
        },

        ...conversation.slice(-12),

        {
            role: "user",

            content: userText
        }
    ];


    return await callPuterAI(
        messages
    );
}


/* =========================
   ANA CEVAP MOTORU
========================= */

async function getAuraResponse(
    userText
) {

    /*
       Önce yerel komutlar
    */

    const localResult =
        handleLocalCommand(
            userText
        );


    if (
        localResult.handled
    ) {

        return localResult.response;
    }


    /*
       Sonra akıllı komutlar
    */

    const smartResult =
        await handleSmartCommand(
            userText
        );


    if (
        smartResult &&
        smartResult.success
    ) {

        /*
           Hava durumu gibi
           kesin verileri direkt
           döndür.
        */

        return smartResult.text;
    }


    /*
       Kullanıcının verdiği
       önemli bilgileri öğren.
    */

    learnFromMessage(
        userText
    );


    /*
       Güncel bilgi gerekiyorsa
       web araması yap.
    */

    if (
        needsWebSearch(
            userText
        )
    ) {

        const query =
            createSearchQuery(
                userText
            );


        const webResult =
            await webSearch(
                query
            );


        if (
            webResult.success
        ) {

            try {

                return await askAIWithWeb(
                    userText,
                    webResult.text
                );

            } catch (error) {

                /*
                   Web sonucu var ama
                   AI tekrar çalışmazsa
                   sonucu kaybetme.
                */

                return (
                    "Web aramasından bulduğum bilgiler:\n\n" +
                    webResult.text
                );
            }
        }
    }


    /*
       Normal AI
    */

    return await askAI(
        userText
    );
}


/* =========================
   SES TEMİZLEME
========================= */

function cleanTextForSpeech(
    text
) {

    return String(text)

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[`*_#>]/g,
            ""
        )

        .replace(
            /\[[^\]]*\]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SESLİ CEVAP
========================= */

function speak(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    const clean =
        cleanTextForSpeech(
            text
        );


    if (!clean) {
        return;
    }


    try {

        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                clean
            );


        utterance.lang =
            "tr-TR";

        utterance.rate =
            0.95;

        utterance.pitch =
            1.05;

        utterance.volume =
            1;


        window.speechSynthesis.speak(
            utterance
        );

    } catch (error) {

        console.error(
            "Ses hatası:",
            error
        );
    }
}


/* =========================
   SES TANIMA
========================= */

let recognition = null;

let isListening = false;

let voiceMode = false;


function setupSpeechRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (
        !SpeechRecognition
    ) {

        return false;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            isListening =
                true;

            micButton.textContent =
                "🔴";

            statusElement.textContent =
                "LISTENING";
        };


    recognition.onresult =
        async function(event) {

            const result =
                event.results[0][0];


            if (!result) {
                return;
            }


            const spokenText =
                result.transcript.trim();


            if (!spokenText) {
                return;
            }


            input.value =
                spokenText;


            await sendMessage(
                true
            );
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Ses tanıma hatası:",
                event.error
            );


            isListening =
                false;

            micButton.textContent =
                "🎤";

            statusElement.textContent =
                "ONLINE";
        };


    recognition.onend =
        function() {

            isListening =
                false;

            micButton.textContent =
                "🎤";

            statusElement.textContent =
                "ONLINE";
        };


    return true;
}


setupSpeechRecognition();


/* =========================
   AURA UYANDIRMA
========================= */

function containsWakeWord(
    text
) {

    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            );


    return (

        lower.includes(
            "aura"
        )

        ||

        lower.includes(
            "aura "
        )

        ||

        lower.startsWith(
            "aura"
        )
    );
}


function removeWakeWord(
    text
) {

    return String(text)
        .replace(
            /^aura[\s,:-]*/i,
            ""
        )
        .trim();
}


/* =========================
   MESAJ GÖNDER
========================= */

let sending = false;


async function sendMessage(
    useVoice = false
) {

    if (sending) {
        return;
    }


    let text =
        input.value.trim();


    if (!text) {
        return;
    }


    /*
       "AURA ..." şeklindeki
       konuşmalarda AURA kelimesini
       komuttan ayır.
    */

    if (
        containsWakeWord(
            text
        )
    ) {

        const cleaned =
            removeWakeWord(
                text
            );


        if (cleaned) {

            text =
                cleaned;
        }
    }


    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    /*
       Kullanıcı mesajını
       geçmişe kaydet.
    */

    conversation.push({

        role: "user",

        content: text
    });


    conversation =
        conversation.slice(-20);


    saveConversation();


    sending =
        true;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    const loading =
        addMessage(
            "Düşünüyorum...",
            "aura"
        );


    try {

        const answer =
            await getAuraResponse(
                text
            );


        if (loading) {

            loading.remove();
        }


        addMessage(
            answer,
            "aura"
        );


        conversation.push({

            role:
                "assistant",

            content:
                answer
        });


        conversation =
            conversation.slice(-20);


        saveConversation();


        /*
           Sesli komut geldiyse
           cevap seslendir.
        */

        if (useVoice) {

            speak(
                answer
            );
        }


    } catch (error) {

        console.error(
            "MESAJ HATASI:",
            error
        );


        if (loading) {

            loading.remove();
        }


        const errorMessage =
            "Şu anda bağlantıda bir sorun oluştu. " +
            "İnternet bağlantını veya AI bağlantısını kontrol edip tekrar deneyebiliriz.";


        addMessage(
            errorMessage,
            "aura"
        );


        if (useVoice) {

            speak(
                errorMessage
            );
        }
    }


    sending =
        false;


    sendButton.disabled =
        false;

    micButton.disabled =
        false;


    statusElement.textContent =
        "ONLINE";


    input.focus();
}


/* =========================
   GÖNDER BUTONU
========================= */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(false);
    }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);
        }
    }
);


/* =========================
   MİKROFON
========================= */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            addMessage(
                "Bu tarayıcı sesli konuşmayı desteklemiyor.",
                "aura"
            );

            return;
        }


        if (isListening) {

            try {

                recognition.stop();

            } catch (error) {

                console.error(error);
            }

            return;
        }


        try {

            recognition.start();

        } catch (error) {

            console.error(
                "Mikrofon başlatılamadı:",
                error
            );
        }
    }
);


/* =========================
   AÇILIŞ DURUMU
========================= */

statusElement.textContent =
    "ONLINE";


input.focus();


/* =========================
   GLOBAL HATA YAKALAMA
========================= */

window.addEventListener(
    "error",
    function(event) {

        console.error(
            "AURA GLOBAL HATA:",
            event.error ||
            event.message
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    function(event) {

        console.error(
            "AURA ASYNC HATA:",
            event.reason
        );
    }
);

</script>
