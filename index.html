<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AURA ♥ EDANUR</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    color:#ffe6f3;
    background:
        radial-gradient(circle at 50% 30%,#74134f 0%,#35071f 32%,#10000b 72%,#030003 100%);
}

/* ARKA PLAN */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
}

.glow.one{
    width:300px;
    height:300px;
    background:#ff258f;
    left:-120px;
    top:80px;
}

.glow.two{
    width:330px;
    height:330px;
    background:#a000ff;
    right:-130px;
    bottom:50px;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px #ff69b4;
    animation:twinkle 2.5s infinite;
}

.s1{top:12%;left:9%}
.s2{top:20%;left:83%;animation-delay:.5s}
.s3{top:34%;left:17%;animation-delay:1s}
.s4{top:42%;right:10%;animation-delay:1.5s}
.s5{top:67%;left:8%;animation-delay:.3s}
.s6{top:74%;right:14%;animation-delay:1.2s}
.s7{top:8%;left:52%;animation-delay:1.8s}
.s8{top:55%;left:91%;animation-delay:.8s}
.s9{top:82%;left:27%;animation-delay:1.4s}
.s10{top:29%;left:64%;animation-delay:.2s}

@keyframes twinkle{
    0%,100%{
        opacity:.2;
        transform:scale(.7);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

/* ANA UYGULAMA */

.app{
    position:relative;
    width:100%;
    height:100%;
    z-index:2;
}

/* ÜST BAR */

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(12,0,10,.76);
    border-bottom:1px solid rgba(255,92,175,.38);
    backdrop-filter:blur(14px);
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.crown{
    color:#ff8ac5;
    font-size:20px;
    text-shadow:0 0 10px #ff1493;
}

.logoText{
    font-family:Georgia,serif;
    font-size:24px;
    letter-spacing:4px;
    color:#fff0f8;
    text-shadow:
        0 0 8px #ff69b4,
        0 0 20px #ff1493;
}

.status{
    font-size:10px;
    letter-spacing:2px;
    color:#ffc0dc;
}

.statusDot{
    display:inline-block;
    width:7px;
    height:7px;
    margin-right:6px;
    border-radius:50%;
    background:#ff4fa8;
    box-shadow:0 0 9px #ff1493;
}

/* MERKEZ */

.center{
    position:absolute;
    top:58px;
    left:0;
    right:0;
    bottom:118px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

/* KALP */

.heartSystem{
    position:relative;
    width:190px;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.orbit{
    position:absolute;
    border:1px solid rgba(255,110,185,.4);
    border-radius:50%;
}

.orbit1{
    width:145px;
    height:145px;
    animation:spin 9s linear infinite;
}

.orbit2{
    width:180px;
    height:180px;
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:spinReverse 13s linear infinite;
}

.orbit3{
    width:215px;
    height:215px;
    border-left-color:transparent;
    border-right-color:transparent;
    animation:spin 17s linear infinite;
}

.heart{
    position:relative;
    width:86px;
    height:86px;
    transform:rotate(-45deg);
    background:linear-gradient(
        135deg,
        #ffb5da,
        #ff4ca7 48%,
        #df006e
    );
    border-radius:9px;
    box-shadow:
        0 0 12px #ff8aca,
        0 0 28px #ff1493,
        0 0 55px rgba(255,20,147,.65);
    animation:heartbeat 1.8s infinite ease-in-out;
}

.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:86px;
    height:86px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #ffb5da,
        #ff4ca7 48%,
        #df006e
    );
}

.heart:before{
    top:-43px;
    left:0;
}

.heart:after{
    top:0;
    left:43px;
}

.heartText{
    position:absolute;
    z-index:5;
    width:125px;
    left:-20px;
    top:34px;
    transform:rotate(45deg);
    text-align:center;
    color:white;
    font-family:Georgia,serif;
    font-size:11px;
    font-weight:bold;
    line-height:1.25;
    letter-spacing:1px;
    white-space:nowrap;
    text-shadow:
        0 0 4px white,
        0 0 10px #ffb5dc;
}

@keyframes heartbeat{
    0%,100%{
        transform:rotate(-45deg) scale(1);
    }
    50%{
        transform:rotate(-45deg) scale(1.08);
    }
}

@keyframes spin{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0)}
}

/* SOHBET */

.chatArea{
    position:absolute;
    left:0;
    right:0;
    top:58px;
    bottom:118px;
    padding:
        12px
        max(12px,calc((100% - 720px)/2))
        12px;
    overflow-y:auto;
    scrollbar-width:none;
    z-index:5;
    pointer-events:auto;
}

.chatArea::-webkit-scrollbar{
    display:none;
}

.chat{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-bottom:20px;
}

.message{
    max-width:78%;
    padding:10px 14px;
    border-radius:17px;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
    white-space:pre-wrap;
    box-shadow:0 0 12px rgba(255,20,147,.08);
}

.auraMessage{
    align-self:flex-start;
    background:rgba(48,3,32,.86);
    border:1px solid rgba(255,105,180,.25);
}

.userMessage{
    align-self:flex-end;
    background:linear-gradient(
        135deg,
        #a91465,
        #e43c91
    );
    border:1px solid rgba(255,170,215,.3);
}

.typing{
    opacity:.7;
    font-style:italic;
}

/* EN ALT */

.bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:110px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            to top,
            rgba(9,0,7,.98),
            rgba(20,0,14,.94)
        );
    border-top:1px solid rgba(255,92,175,.42);
    box-shadow:0 -10px 35px rgba(0,0,0,.4);
    backdrop-filter:blur(16px);
    z-index:30;
}

.inputBar{
    width:min(720px,100%);
    height:58px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px;
    border:1px solid rgba(255,91,173,.4);
    border-radius:30px;
    background:rgba(30,0,20,.92);
    box-shadow:
        0 0 20px rgba(255,20,147,.13),
        inset 0 0 15px rgba(255,105,180,.04);
}

.iconButton{
    width:43px;
    height:43px;
    flex:0 0 43px;
    border:1px solid rgba(255,105,180,.3);
    border-radius:50%;
    background:rgba(255,90,170,.09);
    color:#ffc4df;
    font-size:19px;
    cursor:pointer;
}

.textInput{
    min-width:0;
    flex:1;
    height:43px;
    padding:0 12px;
    border:0;
    outline:0;
    border-radius:18px;
    background:rgba(255,255,255,.045);
    color:white;
    font-size:14px;
}

.textInput::placeholder{
    color:rgba(255,190,220,.55);
}

.actionButton{
    width:45px;
    height:45px;
    flex:0 0 45px;
    border:0;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #ff77bb,
        #d40070
    );
    color:white;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 0 15px rgba(255,20,147,.4);
}

.actionButton:disabled{
    opacity:.45;
}

.iconButton:active,
.actionButton:active{
    transform:scale(.92);
}

@media(max-width:500px){

    .logoText{
        font-size:20px;
    }

    .center{
        bottom:105px;
    }

    .chatArea{
        bottom:105px;
    }

    .bottom{
        height:105px;
        padding:9px;
    }

    .inputBar{
        height:54px;
        gap:5px;
    }

    .iconButton{
        width:38px;
        height:38px;
        flex-basis:38px;
        font-size:17px;
    }

    .actionButton{
        width:40px;
        height:40px;
        flex-basis:40px;
    }

    .textInput{
        height:38px;
        font-size:13px;
    }

    .heartSystem{
        transform:scale(.82);
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="star s6"></div>
    <div class="star s7"></div>
    <div class="star s8"></div>
    <div class="star s9"></div>
    <div class="star s10"></div>
</div>

<div class="app">

    <header class="top">

        <div class="logo">
            <span class="crown">♕</span>
            <span class="logoText">AURA</span>
        </div>

        <div class="status">
            <span class="statusDot"></span>
            <span id="statusText">ONLINE</span>
        </div>

    </header>


    <main>

        <div class="center">

            <div class="heartSystem">

                <div class="orbit orbit1"></div>
                <div class="orbit orbit2"></div>
                <div class="orbit orbit3"></div>

                <div class="heart">

                    <div class="heartText">
                        I LOVE<br>
                        YOU 300
                    </div>

                </div>

            </div>

        </div>


        <div
            class="chatArea"
            id="chatArea"
        >

            <div
                class="chat"
                id="chat"
            ></div>

        </div>

    </main>


    <!-- HER ZAMAN EN ALTTA -->

    <div class="bottom">

        <div class="inputBar">

            <button
                class="iconButton"
                id="heartButton"
                type="button"
            >♡</button>


            <input
                class="textInput"
                id="messageInput"
                type="text"
                placeholder="AURA’ya bir şey söyle..."
                autocomplete="off"
                enterkeyhint="send"
            >


            <button
                class="iconButton"
                id="emojiButton"
                type="button"
            >☺</button>


            <button
                class="iconButton"
                id="micButton"
                type="button"
            >🎤</button>


            <button
                class="actionButton"
                id="sendButton"
                type="button"
            >➤</button>

        </div>

    </div>

</div>


<script src="https://js.puter.com/v2/"></script><script>

/* =====================================================
   AURA - TEMEL SİSTEM
===================================================== */

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const chat =
    document.getElementById("chat");

const chatArea =
    document.getElementById("chatArea");

const statusText =
    document.getElementById("statusText");

const heartButton =
    document.getElementById("heartButton");

const emojiButton =
    document.getElementById("emojiButton");


let busy = false;


/* =====================================================
   MESAJ EKLEME
===================================================== */

function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            type === "user"
            ? "userMessage"
            : "auraMessage"
        );

    message.textContent =
        String(text);

    chat.appendChild(message);

    chatArea.scrollTop =
        chatArea.scrollHeight;

    return message;
}


/* =====================================================
   AURA'NIN CEVABI
===================================================== */

async function askAura(text){

    /*
       Burada web araması YOK.

       Önce normal mesaj gönderme
       sistemini sağlamlaştırıyoruz.
    */

    if(
        typeof puter === "undefined" ||
        !puter.ai ||
        !puter.ai.chat
    ){

        throw new Error(
            "Puter AI hazır değil."
        );
    }


    const prompt = `
Sen AURA'sın.

Edanur için hazırlanmış özel,
nazik, doğal ve akıllı bir yapay
zeka asistanısın.

Türkçe konuş.

Kullanıcının adını gereksiz yere
tekrar etme.

Kısa ama doğal cevaplar ver.

Kullanıcı:
${text}
`;


    const response =
        await puter.ai.chat(prompt);


    if(!response){

        throw new Error(
            "Boş AI cevabı."
        );
    }


    if(
        typeof response ===
        "string"
    ){

        return response.trim();
    }


    if(
        response.message &&
        typeof response.message.content ===
        "string"
    ){

        return response.message.content.trim();
    }


    if(
        typeof response.text ===
        "string"
    ){

        return response.text.trim();
    }


    return String(response);
}


/* =====================================================
   ASIL GÖNDERME FONKSİYONU
===================================================== */

async function sendMessage(){

    /*
       Çift tıklama / aynı anda iki istek
       engelleniyor.
    */

    if(busy){

        return;
    }


    const text =
        input.value.trim();


    if(!text){

        input.focus();

        return;
    }


    /*
       KULLANICI MESAJINI HEMEN GÖSTER.
       Böylece buton kesin olarak çalışıyor.
    */

    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    input.focus();


    busy =
        true;

    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    statusText.textContent =
        "DÜŞÜNÜYOR";


    const typing =
        addMessage(
            "AURA düşünüyor...",
            "aura"
        );

    typing.classList.add(
        "typing"
    );


    try{

        const answer =
            await askAura(text);


        typing.remove();


        addMessage(
            answer,
            "aura"
        );


        statusText.textContent =
            "ONLINE";


    }catch(error){

        console.error(
            "AURA HATASI:",
            error
        );


        typing.remove();


        addMessage(
            "Şu anda yapay zekâ bağlantısında bir sorun oluştu. Lütfen tekrar dene.",
            "aura"
        );


        statusText.textContent =
            "BAĞLANTI HATASI";

    }


    busy =
        false;

    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =====================================================
   GÖNDER BUTONU
===================================================== */

sendButton.onclick =
    function(event){

        event.preventDefault();

        sendMessage();
    };


/* =====================================================
   ENTER İLE GÖNDER
===================================================== */

input.onkeydown =
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    };


/* =====================================================
   KALP BUTONU
===================================================== */

heartButton.onclick =
    function(){

        input.value =
            "Seni seviyorum ❤️";

        input.focus();
    };


/* =====================================================
   EMOJI
===================================================== */

emojiButton.onclick =
    function(){

        input.value +=
            " ❤️";

        input.focus();
    };


/* =====================================================
   MİKROFON
===================================================== */

let recognition =
    null;

let listening =
    false;


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            listening =
                true;

            micButton.textContent =
                "🔴";

            statusText.textContent =
                "DİNLİYOR";

        };


    recognition.onresult =
        function(event){

            if(
                !event.results ||
                !event.results[0]
            ){

                return;
            }


            const spoken =
                event.results[0][0]
                    .transcript
                    .trim();


            if(spoken){

                input.value =
                    spoken;

                sendMessage();
            }
        };


    recognition.onerror =
        function(event){

            console.error(
                "Mikrofon:",
                event.error
            );

            listening =
                false;

            micButton.textContent =
                "🎤";

            statusText.textContent =
                "ONLINE";
        };


    recognition.onend =
        function(){

            listening =
                false;

            micButton.textContent =
                "🎤";

            if(
                statusText.textContent ===
                "DİNLİYOR"
            ){

                statusText.textContent =
                    "ONLINE";
            }
        };

}else{

    micButton.onclick =
        function(){

            addMessage(
                "Bu tarayıcı sesli konuşmayı desteklemiyor.",
                "aura"
            );
        };
}


if(recognition){

    micButton.onclick =
        function(){

            if(listening){

                try{
                    recognition.stop();
                }catch(e){}

                return;
            }


            try{

                recognition.start();

            }catch(error){

                console.error(
                    error
                );
            }
        };
}


/* =====================================================
   İLK MESAJ
===================================================== */

addMessage(
    "Merhaba. Ben AURA. Hazırım. ❤️",
    "aura"
);


/* =====================================================
   SAYFA HAZIR
===================================================== */

statusText.textContent =
    "ONLINE";

input.focus();


/* =====================================================
   GLOBAL HATA
===================================================== */

window.onerror =
    function(
        message,
        source,
        line,
        column,
        error
    ){

        console.error(
            "AURA GLOBAL ERROR:",
            message,
            error
        );

        return false;
    };


</script>

</body>
</html>
